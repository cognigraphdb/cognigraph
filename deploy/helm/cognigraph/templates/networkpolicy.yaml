{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cognigraph.fullname" . }}
  labels:
    {{- include "cognigraph.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cognigraph.serverSelectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- with .Values.networkPolicy.allowFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: http
{{- end }}
