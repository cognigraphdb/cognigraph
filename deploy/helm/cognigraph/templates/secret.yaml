{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cognigraph.authSecretName" . }}
  labels:
    {{- include "cognigraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ .Values.auth.adminPassword | quote }}
  host-admin-password: {{ .Values.auth.hostAdminPassword | quote }}
  jwt-secret: {{ .Values.auth.jwtSecret | quote }}
{{- end }}
