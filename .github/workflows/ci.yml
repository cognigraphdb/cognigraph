name: CI

# Manual-only during active development. The shared local pre-push gate includes
# Rust, UI and real Community/Enterprise browser regressions. Trigger deliberately
# from Actions or `gh workflow run ci.yml` for remote verification/publication.
on:
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish the verified version to Docker Hub (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Serialize manual runs, including publication; never cancel an active upload.
concurrency:
  group: cognigraph-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Rust + UI + Community and Enterprise browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Refuse publication outside the official main branch
        if: inputs.publish_images
        run: |
          test "$GITHUB_REPOSITORY" = cognigraphdb/cognigraph
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Issue identities are checked against their first committed record.

      - name: Install Rust (stable + clippy + rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install locked UI dependencies and Chromium system dependencies
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun --bun x --no-install playwright install --with-deps chromium

      # The exact shared local gates, exit-code checked. Environment-gated
      # Arango tests require ARANGO_PASSWORD. The runner disables live LLM loops;
      # embedding-provider tests require explicit --ignored qualification.
      - name: Shared local and CI checks
        run: python3 scripts/verify.py --suite ci

      - name: Browser regression results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-results
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker builds, runtime checks and optional publication
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    # The image is the deployment artifact; build it on main only (it
    # recompiles the workspace in release mode inside the container). With the
    # workflow now manual, this runs when CI is dispatched from main.
    if: github.ref == 'refs/heads/main' && github.repository == 'cognigraphdb/cognigraph'
    steps:
      - uses: actions/checkout@v7
      - name: Check publication candidate and unused version tags
        if: inputs.publish_images
        run: python3 scripts/docker_images.py preflight
      - name: Community and Enterprise Docker builds
        run: python3 scripts/verify.py --suite docker
      - name: Log in to Docker Hub
        if: inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: cognigraph
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both tested editions with version tags
        if: inputs.publish_images
        run: python3 scripts/docker_images.py publish
