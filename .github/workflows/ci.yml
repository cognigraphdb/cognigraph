name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish the verified version to Docker Hub (official main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Superseded verification can stop; explicit publication runs are never cancelled.
concurrency:
  group: cognigraph-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Rust, UI and Native acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Require dependency PRs to target develop
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          case "$PR_AUTHOR" in
            'renovate[bot]'|'dependabot[bot]') test "$PR_BASE" = develop ;;
          esac
      - name: Refuse publication outside the official main branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: |
          test "$GITHUB_REPOSITORY" = cognigraphdb/cognigraph
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Issue identities require their original committed history.
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install workflow and advisory tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Install UI dependencies and Chromium
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun --bun x --no-install playwright install --with-deps chromium
      - name: Shared local and CI checks
        run: python3 scripts/verify.py --suite ci
      - name: Native and browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-results
          path: |
            ui/test-results/
            target/ci/native/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Packaged editions and Helm backups
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Check publication candidate and unused version tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: python3 scripts/docker_images.py preflight
      - name: Build and verify both images and Helm backups
        run: python3 scripts/verify.py --suite docker
      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: cognigraph
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both tested editions with version tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: python3 scripts/docker_images.py publish

  required:
    name: CI required
    if: always()
    needs: [gates, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$GATES_RESULT" = success
          test "$DOCKER_RESULT" = success
