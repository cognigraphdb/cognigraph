name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      publish_images:
        description: Publish the verified version to Docker Hub (official main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Superseded verification can stop; explicit publication runs are never cancelled.
concurrency:
  group: cognigraph-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: Rust, UI and Native acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - name: Require dependency PRs to target develop
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          case "$PR_AUTHOR" in
            'renovate[bot]'|'dependabot[bot]') test "$PR_BASE" = develop ;;
          esac
      - name: Refuse publication outside the official main branch
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: |
          test "$GITHUB_REPOSITORY" = cognigraphdb/cognigraph
          test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Issue identities require their original committed history.
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Install workflow and advisory tools
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cargo install cargo-audit --version 0.22.2 --locked
      - name: Install UI dependencies and Chromium
        working-directory: ui
        run: |
          bun install --frozen-lockfile
          bun --bun x --no-install playwright install --with-deps chromium
      - name: Inspect incoming PRs before candidate qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-incoming.py
      - name: Shared local and CI checks
        run: python3 scripts/verify.py --suite ci
      - name: Recheck incoming snapshot after source qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-incoming.py --mode compare
      - name: Native and browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-results
          path: |
            ui/test-results/
            target/ci/native/
            target/ci/incoming.json
            target/ci/dependencies/
          if-no-files-found: ignore
          retention-days: 7

  platforms:
    name: Apple Silicon source build and smoke
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build both editions and smoke the bare binaries on arm64 macOS
        run: python3 scripts/check-platform-smoke.py
      - name: Platform smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: platform-smoke-results
          path: target/ci/platform/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Packaged editions and Helm backups (${{ matrix.arch }})
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    env:
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4
      - name: Check publication candidate and unused version tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: python3 scripts/docker_images.py preflight
      - name: Install image vulnerability scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
      - name: Build and verify both images and Helm backups
        run: python3 scripts/verify.py --suite docker
      - name: Recheck incoming work after image qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-incoming.py
      - name: Image vulnerability reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: image-security-results-${{ matrix.arch }}
          path: target/ci/image-security/
          if-no-files-found: ignore
          retention-days: 7
      - name: Export the tested images for publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: python3 scripts/docker_images.py export
      - name: Hand the tested images to the publish job
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tested-images-${{ matrix.arch }}
          path: target/ci/images/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-architecture images
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    needs: [gates, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Collect the tested images of both architectures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tested-images-*
          path: target/ci/images
          merge-multiple: true
      - name: Recheck the publication candidate and unused version tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: python3 scripts/docker_images.py preflight
      - name: Log in to Docker Hub
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: cognigraph
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish both tested editions as multi-architecture version and latest tags
        if: github.event_name == 'workflow_dispatch' && inputs.publish_images
        run: python3 scripts/docker_images.py publish

  required:
    name: CI required
    if: always()
    needs: [gates, docker, platforms]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job to succeed
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          PLATFORMS_RESULT: ${{ needs.platforms.result }}
        run: |
          test "$GATES_RESULT" = success
          test "$DOCKER_RESULT" = success
          test "$PLATFORMS_RESULT" = success
