ollama = []
cloudflare = []
oauth = []
onnx = ["dep:ort", "dep:tokenizers"]

[dependencies.ort]
version = "2.0.0-rc.12"
optional = true

[dependencies.tokenizers]
version = "0.23"
optional = true

[dev-dependencies]
tokio = { workspace = true }
dotenvy = "0.15"
