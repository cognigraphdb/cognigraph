openapi: 3.0.3
info:
  title: CogniGraph
  version: 2.6.1 # Replaced with the package version at build time.
  description: |
    Self-contained knowledge-graph platform: documents, edges, traversal,
    CGQL queries, vector/BM25/hybrid/graph-augmented search, semantic query
    cache, Lua scripting, and governed knowledge construction.

    Authentication (when COGNIGRAPH_AUTH_ENABLED=true): bearer token — either a static
    API token or a JWT session from POST /api/auth/login. Tenant roles include
    admin, editor, viewer, script-runner, policy-author, policy-approver,
    promoter, and artifact-attestor; host-admin is control-plane-only. This file is served live at
    GET /openapi.yaml after build-time edition filtering (JSON, valid YAML 1.2).
servers:
  - url: http://localhost:3000
security:
  - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    PromotionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 1-128 printable ASCII characters; exact request replays, changed reuse conflicts.
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    Document:
      type: object
      description: Arbitrary JSON document. `_key`/`_id` are system-managed.
      additionalProperties: true
    SearchHit:
      type: object
      properties:
        document: { $ref: '#/components/schemas/Document' }
        score: { type: number }
        source: { type: string, nullable: true }
    Results:
      type: object
      properties:
        results: { type: array, items: {} }
        count: { type: integer }
    JobKind:
      type: string
      enum: [construct.ingest, construct.evaluate, construct.draft, sideviews.generate]
      description: Durable operation with immutable submitted input. Resolved execution inputs depend on kind; side-view keys are frozen but source text is read during execution.
    JobStatus:
      type: string
      enum: [queued, running, cancel_requested, succeeded, failed, canceled]
    JobActor:
      type: object
      required: [type, username]
      properties:
        type: { type: string, enum: [user, anonymous, system] }
        user_key: { type: string, nullable: true }
        username: { type: string }
        role: { type: string, nullable: true }
    JobProgress:
      type: object
      required: [phase, completed, total]
      properties:
        phase: { type: string }
        completed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        facts_grounded: { type: integer, minimum: 0 }
        side_views_written: { type: integer, minimum: 0, description: Side-view rows written at durable checkpoints; zero for other job kinds. }
    JobFailure:
      type: object
      nullable: true
      required: [message]
      properties:
        code: { type: string, nullable: true }
        message: { type: string }
        retryable: { type: boolean }
    JobEvent:
      type: object
      required: [sequence, event, at, attempt, actor]
      properties:
        sequence: { type: integer, format: int64, minimum: 0 }
        event: { type: string }
        at: { type: integer, format: int64, description: Unix timestamp in milliseconds }
        attempt: { type: integer, minimum: 0 }
        actor: { $ref: '#/components/schemas/JobActor' }
        from_status: { type: string, enum: [queued, running, cancel_requested, succeeded, failed, canceled], nullable: true }
        to_status: { type: string, enum: [queued, running, cancel_requested, succeeded, failed, canceled], nullable: true }
        message: { type: string, nullable: true }
    JobSummary:
      type: object
      required:
        - id
        - schema_version
        - kind
        - status
        - tenant
        - actor
        - attempt
        - recoveries
        - created_at
        - updated_at
        - progress
      properties:
        id: { type: string, description: Stable tenant-scoped job identifier }
        schema_version: { type: integer, enum: [1, 2, 3, 4], description: Schema 2 is M21 verified consumption; schema 3 is M22 reproducible derivation; schema 4 is M23 raw-document preparation. }
        kind: { $ref: '#/components/schemas/JobKind' }
        status: { $ref: '#/components/schemas/JobStatus' }
        tenant: { type: string }
        actor: { $ref: '#/components/schemas/JobActor' }
        attempt: { type: integer, minimum: 0 }
        recoveries: { type: integer, minimum: 0 }
        created_at: { type: integer, format: int64, description: Unix timestamp in milliseconds }
        updated_at: { type: integer, format: int64, description: Unix timestamp in milliseconds }
        started_at: { type: integer, format: int64, nullable: true }
        finished_at: { type: integer, format: int64, nullable: true }
        archived_at: { type: integer, format: int64, nullable: true, description: Copy-first archive timestamp; null while the record is in the hot collection. }
        progress: { $ref: '#/components/schemas/JobProgress' }
    Job:
      type: object
      required:
        - id
        - schema_version
        - kind
        - status
        - tenant
        - actor
        - attempt
        - recoveries
        - created_at
        - updated_at
        - progress
        - input
      properties:
        id: { type: string, description: Stable tenant-scoped job identifier }
        schema_version: { type: integer, enum: [1, 2, 3, 4], description: Schema 2 is M21 verified consumption; schema 3 is M22 reproducible derivation; schema 4 is M23 raw-document preparation. }
        kind: { $ref: '#/components/schemas/JobKind' }
        status: { $ref: '#/components/schemas/JobStatus' }
        tenant: { type: string }
        actor: { $ref: '#/components/schemas/JobActor' }
        attempt: { type: integer, minimum: 0 }
        recoveries: { type: integer, minimum: 0 }
        created_at: { type: integer, format: int64, description: Unix timestamp in milliseconds }
        updated_at: { type: integer, format: int64, description: Unix timestamp in milliseconds }
        started_at: { type: integer, format: int64, nullable: true }
        finished_at: { type: integer, format: int64, nullable: true }
        archived_at: { type: integer, format: int64, nullable: true }
        progress: { $ref: '#/components/schemas/JobProgress' }
        input:
          $ref: '#/components/schemas/JobOperationInput'
        result:
          type: object
          nullable: true
          description: >-
            Operation-specific result. A successful M21-M23 construct.evaluate job
            includes the verified-consumption receipt that binds the returned
            metrics to its exact staged artifact bytes and durable job identity.
          properties:
            artifact_consumption:
              $ref: '#/components/schemas/ArtifactConsumptionReceipt'
          additionalProperties: true
        error:
          $ref: '#/components/schemas/JobFailure'
        events:
          type: array
          description: Append-only transition audit events; included by the detail endpoint.
          items: { $ref: '#/components/schemas/JobEvent' }
    JobSubmission:
      type: object
      required: [job, replayed]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        replayed: { type: boolean, description: 'True when this idempotency key already named the same canonical {kind,input} request.' }
    JobCancellation:
      type: object
      required: [job, changed]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        changed: { type: boolean, description: False when cancellation was already requested or the job was terminal. }
    JobRetry:
      type: object
      required: [job, replayed]
      properties:
        job: { $ref: '#/components/schemas/Job' }
        replayed: { type: boolean, description: True when this retry idempotency key was already applied. }
    JobList:
      type: object
      required: [jobs, count, total, limit, pagination]
      properties:
        jobs: { type: array, items: { $ref: '#/components/schemas/JobSummary' } }
        count: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0, nullable: true, description: Exact only for deprecated offset mode; null for bounded cursor mode. }
        limit: { type: integer, minimum: 1 }
        pagination: { type: string, enum: [cursor, offset] }
        offset: { type: integer, minimum: 0, nullable: true }
        next_cursor: { type: string, nullable: true }
        scanned: { type: integer, minimum: 0, nullable: true, description: Lightweight catalog rows inspected by this bounded cursor request. }
    Sha256Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: Lowercase SHA-256 wire form used for canonical-record identities and exact raw-byte identities.
    EvalQuestion:
      type: object
      required: [id]
      properties:
        id: { type: string, minLength: 1 }
        question: { type: string, default: '' }
        expected_facts:
          type: array
          items: { type: string, description: 'Fact in `source --RELATION--> target` notation.' }
          default: []
        forbidden_facts:
          type: array
          items: { type: string, description: 'Fact in `source --RELATION--> target` notation.' }
          default: []
      additionalProperties: false
    EvalSpec:
      type: object
      required: [space_id]
      properties:
        space_id: { type: string, minLength: 1 }
        questions:
          type: array
          items: { $ref: '#/components/schemas/EvalQuestion' }
          default: []
      additionalProperties: false
    ConstructChunk:
      type: object
      description: Construction normalizes text to NFC before grounding. Content hashes and UTF-8 evidence spans refer to those canonical stored bytes.
      required: [id, text]
      properties:
        id: { type: string }
        title: { type: string, default: '' }
        text: { type: string }
      additionalProperties: true
    GovernedConstructIngestRequest:
      type: object
      description: One bounded atomic materialization using only the exact approved M25 revision selected by the current promotion head.
      required: [target, chunks]
      properties:
        target: { $ref: '#/components/schemas/PromotionTarget' }
        chunks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/ConstructChunk' }
      additionalProperties: false
    GovernedConstructAuthority:
      type: object
      required: [promotion_head_decision_id, promotion_generation, candidate_digest, semantic_repair_revision_id, semantic_repair_revision_digest, semantic_repair_review_id, semantic_repair_review_digest]
      properties:
        promotion_head_decision_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        promotion_generation: { type: integer, format: int64, minimum: 1 }
        candidate_digest: { $ref: '#/components/schemas/Sha256Digest' }
        semantic_repair_revision_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        semantic_repair_revision_digest: { $ref: '#/components/schemas/Sha256Digest' }
        semantic_repair_review_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        semantic_repair_review_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    GovernedConstructIngestResponse:
      type: object
      required: [target, chunks, facts_grounded, accepted_neurons, authority]
      properties:
        target: { $ref: '#/components/schemas/PromotionTarget' }
        chunks: { type: integer, minimum: 1, maximum: 1000 }
        facts_grounded: { type: integer, minimum: 0 }
        accepted_neurons: { type: integer, minimum: 0 }
        authority: { $ref: '#/components/schemas/GovernedConstructAuthority' }
      additionalProperties: false
    ConstructIngestJobInput:
      type: object
      required: [space_type, chunks]
      properties:
        space_type: { type: string, minLength: 1 }
        chunks:
          type: array
          minItems: 1
          maxItems: 100000
          items: { $ref: '#/components/schemas/ConstructChunk' }
      additionalProperties: false
    ConstructEvaluateJobInput:
      type: object
      required: [space_type]
      description: >-
        Durable evaluation input. `eval` may be omitted to resolve the stored
        tenant EvalSpec. Evidence-eligible M18-M23 jobs include a complete
        `promotion_context`; the server then requires a non-empty distinct
        expected/forbidden union and verifies all context bindings. An M21
        schema 4 context selects job schema 2 and verified local-CAS
        consumption; an M22 schema 5 context selects job schema 3 and exact
        prepared-corpus derivation. An M23 schema 6 context selects job schema 4,
        reproducibly prepares corpus.json from exact raw documents.json bytes,
        then performs M22 derivation. M21-M23 require the local CAS to be enabled.
      properties:
        space_type: { type: string, minLength: 1 }
        eval:
          allOf:
            - { $ref: '#/components/schemas/EvalSpec' }
          nullable: true
        promotion_context:
          allOf:
            - { $ref: '#/components/schemas/PromotionContext' }
          nullable: true
      additionalProperties: false
    ConstructDraftJobInput:
      type: object
      required: [space_type, chunks]
      description: >-
        Draft a NEW space, always per-document. Group chunks by trimmed title in
        first-seen order; untitled chunks share one group. At most 2000 groups.
        Freeze chunks and sample_cap, then checkpoint into inert space_type_drafts.
        Completion provider required. Does not accept async or per_document fields.
      properties:
        space_type: { type: string }
        chunks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ConstructChunk' }
        sample_cap: { type: integer, minimum: 0, default: 40, nullable: true, description: Per-document sample cap; zero samples one chunk. Self-checks use all chunks. }
      additionalProperties: false
    SideviewsGenerateJobInput:
      type: object
      required: [collection]
      description: >-
        Freeze at most 10000 exact source keys from an ordinary collection;
        source text and provider configuration are read during execution.
        Requires completion, embedding, and atomic batches. Unknown fields fail.
      properties:
        collection: { type: string, description: "Ordinary source collection; system, governed, generated, and slash-containing names are ineligible." }
        text_field: { type: string, default: text, nullable: true, description: "Top-level field; omitted, null, or blank selects text." }
        count: { type: integer, minimum: 0, default: 12, nullable: true, description: "Requested pair count, clamped to 1..50; zero and values above 50 are accepted. Returned pair count is not guaranteed." }
        regenerate: { type: boolean, default: false, nullable: true, description: Atomically replace existing rows per parent; false skips parents with rows. }
      additionalProperties: false
    DirectedRelation:
      type: object
      required: [relation, description, require_in_sentence]
      properties:
        relation: { type: string, minLength: 1, description: Nonblank name; trimmed names must be unique in the taxonomy. }
        description: { type: string, description: Relation guidance shown to the model. }
        require_in_sentence:
          type: array
          minItems: 1
          items: { type: string }
          description: At least one nonblank phrase; a phrase must be affirmed in the evidence sentence.
      additionalProperties: true
    DirectedConstructRequest:
      type: object
      required: [space_type, taxonomy, chunks]
      properties:
        space_type: { type: string, description: Exact destination id; a missing space is created as accepted and rule-less. }
        taxonomy:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DirectedRelation' }
        chunks:
          type: array
          minItems: 1
          maxItems: 32
          items: { $ref: '#/components/schemas/ConstructChunk' }
      additionalProperties: false
    ConstructDraftRequest:
      type: object
      required: [space_type, chunks]
      properties:
        space_type: { type: string, description: NEW space id; must not already exist in space_types. }
        chunks:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ConstructChunk' }
        sample_cap: { type: integer, minimum: 0, default: 40, nullable: true, description: "Per pass; zero samples one chunk, while self-checks use the full corpus." }
        per_document: { type: boolean, default: false, description: Sync mode groups by trimmed title; async always groups per document regardless of this value. }
        async: { type: boolean, default: false, description: Enqueue construct.draft instead of completing in this HTTP request. Requires Idempotency-Key and at most 2000 title groups. }
      additionalProperties: true
    JobOperationInput:
      description: Immutable submitted input; shape selected by the job kind. Ingest and draft shapes overlap, so this is an anyOf.
      anyOf:
        - { $ref: '#/components/schemas/ConstructIngestJobInput' }
        - { $ref: '#/components/schemas/ConstructEvaluateJobInput' }
        - { $ref: '#/components/schemas/ConstructDraftJobInput' }
        - { $ref: '#/components/schemas/SideviewsGenerateJobInput' }
    JobSubmissionRequest:
      oneOf:
        - { $ref: '#/components/schemas/ConstructIngestJobRequest' }
        - { $ref: '#/components/schemas/ConstructEvaluateJobRequest' }
        - { $ref: '#/components/schemas/ConstructDraftJobRequest' }
        - { $ref: '#/components/schemas/SideviewsGenerateJobRequest' }
      discriminator:
        propertyName: kind
        mapping:
          construct.ingest: '#/components/schemas/ConstructIngestJobRequest'
          construct.evaluate: '#/components/schemas/ConstructEvaluateJobRequest'
          construct.draft: '#/components/schemas/ConstructDraftJobRequest'
          sideviews.generate: '#/components/schemas/SideviewsGenerateJobRequest'
    ConstructIngestJobRequest:
      type: object
      required: [kind, input]
      properties:
        kind: { type: string, enum: [construct.ingest] }
        input: { $ref: '#/components/schemas/ConstructIngestJobInput' }
      additionalProperties: false
    ConstructEvaluateJobRequest:
      type: object
      required: [kind, input]
      properties:
        kind: { type: string, enum: [construct.evaluate] }
        input: { $ref: '#/components/schemas/ConstructEvaluateJobInput' }
      additionalProperties: false
    ConstructDraftJobRequest:
      type: object
      required: [kind, input]
      properties:
        kind: { type: string, enum: [construct.draft] }
        input: { $ref: '#/components/schemas/ConstructDraftJobInput' }
      additionalProperties: false
    SideviewsGenerateJobRequest:
      type: object
      required: [kind, input]
      properties:
        kind: { type: string, enum: [sideviews.generate] }
        input: { $ref: '#/components/schemas/SideviewsGenerateJobInput' }
      additionalProperties: false
    PromotionArtifactIdentity:
      type: object
      required: [uri, media_type, bytes, digest]
      properties:
        uri: { type: string, minLength: 1, maxLength: 2048 }
        media_type: { type: string, minLength: 1, maxLength: 256 }
        bytes: { type: integer, format: int64, minimum: 1 }
        digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    PromotionCandidateIdentity:
      type: object
      required: [kind, id, revision, artifact, candidate_digest]
      properties:
        kind: { type: string, minLength: 1, maxLength: 256 }
        id: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: string, minLength: 1, maxLength: 256 }
        artifact: { $ref: '#/components/schemas/PromotionArtifactIdentity' }
        candidate_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Must equal `artifact.digest`.
      additionalProperties: false
    PromotionEffectiveConfiguration:
      type: object
      required:
        - construction_config_digest
        - evaluation_config_digest
        - eval_spec_digest
        - preprocessing_digest
        - scorer_id
        - scorer_version
        - scorer_artifact_digest
      properties:
        construction_config_digest: { $ref: '#/components/schemas/Sha256Digest' }
        evaluation_config_digest: { $ref: '#/components/schemas/Sha256Digest' }
        eval_spec_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preprocessing_digest: { $ref: '#/components/schemas/Sha256Digest' }
        scorer_id: { type: string, enum: [cognigraph-construct.evaluate] }
        scorer_version: { type: string, enum: ['1'] }
        scorer_artifact_digest:
          type: string
          enum: ['sha256:8183bb4d95079a0919150573935b451147385d022f05d659ce8af2e661d3c45b']
          description: Pinned operator-trusted scorer semantics identity; M18 does not fetch or cryptographically verify an external scorer binary.
      additionalProperties: false
    PromotionRevisionAttestation:
      type: object
      required:
        - kind
        - revision_id
        - manifest_uri
        - manifest_digest
        - source_lineage
        - immutability_method
        - issuer
        - issued_at_ms
        - verification_uri
        - verification_digest
        - immutable
      properties:
        kind: { type: string, minLength: 1, maxLength: 256 }
        revision_id: { type: string, minLength: 1, maxLength: 256 }
        manifest_uri: { type: string, minLength: 1, maxLength: 2048 }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        source_lineage: { type: string, minLength: 1, maxLength: 256 }
        immutability_method: { type: string, minLength: 1, maxLength: 256 }
        issuer: { type: string, minLength: 1, maxLength: 256 }
        issued_at_ms: { type: integer, format: int64, minimum: 1 }
        verification_uri: { type: string, minLength: 1, maxLength: 2048 }
        verification_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          nullable: true
        configuration_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          nullable: true
        immutable: { type: boolean, enum: [true] }
      additionalProperties: false
    PromotionRevisionSet:
      type: object
      required: [corpus, graph, oracle]
      description: The three attestations must declare `kind` corpus, graph, and oracle respectively.
      properties:
        corpus: { $ref: '#/components/schemas/PromotionRevisionAttestation' }
        graph: { $ref: '#/components/schemas/PromotionRevisionAttestation' }
        oracle: { $ref: '#/components/schemas/PromotionRevisionAttestation' }
      additionalProperties: false
    PromotionCaseExclusion:
      type: object
      required: [case_id, reason_code]
      properties:
        case_id: { type: string, minLength: 1, maxLength: 256 }
        reason_code: { type: string, minLength: 1, maxLength: 256 }
      additionalProperties: false
    PromotionCaseManifest:
      type: object
      required:
        - artifact
        - digest
        - reviewed_case_union_digest
        - exclusions
        - exclusions_digest
        - expected_distinct
        - forbidden_distinct
      properties:
        artifact: { $ref: '#/components/schemas/PromotionArtifactIdentity' }
        digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Must equal `artifact.digest`.
        reviewed_case_union_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Must equal the canonical resolved EvalSpec digest.
        exclusions:
          type: array
          maxItems: 0
          items: { $ref: '#/components/schemas/PromotionCaseExclusion' }
          description: M18 v1 requires no excluded reviewed case.
        exclusions_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of the exclusions array.
        expected_distinct: { type: integer, format: int64, minimum: 1 }
        forbidden_distinct: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    PromotionRecallPolicy:
      type: object
      required: [min_expected_distinct, min_ratio_numerator, min_ratio_denominator, max_missing, max_additional_missing_vs_baseline]
      properties:
        min_expected_distinct: { type: integer, format: int64, minimum: 1 }
        min_ratio_numerator: { type: integer, format: int64, minimum: 0 }
        min_ratio_denominator: { type: integer, format: int64, minimum: 1 }
        max_missing: { type: integer, format: int64, minimum: 0 }
        max_additional_missing_vs_baseline: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PromotionRestraintPolicy:
      type: object
      required: [min_forbidden_distinct, min_ratio_numerator, min_ratio_denominator, max_violations, max_additional_violations_vs_baseline]
      properties:
        min_forbidden_distinct: { type: integer, format: int64, minimum: 1 }
        min_ratio_numerator: { type: integer, format: int64, minimum: 0 }
        min_ratio_denominator: { type: integer, format: int64, minimum: 1 }
        max_violations: { type: integer, format: int64, minimum: 0 }
        max_additional_violations_vs_baseline: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PromotionExclusionPolicy:
      type: object
      required: [allowed_reason_codes, max_count, require_same_manifest_as_baseline]
      properties:
        allowed_reason_codes:
          type: array
          maxItems: 0
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 256 }
          description: M18 v1 requires this list to be empty.
        max_count: { type: integer, format: int64, enum: [0] }
        require_same_manifest_as_baseline: { type: boolean, enum: [true] }
      additionalProperties: false
    PromotionCandidateDifference:
      type: string
      enum: [candidate_identity, construction_configuration, graph_revision, resolved_configuration]
    PromotionOracleStageRule:
      type: object
      required: [stage, allow_oracle_reads]
      properties:
        stage: { type: string, enum: [candidate_build, candidate_tuning, construction, evaluation] }
        allow_oracle_reads: { type: boolean }
      additionalProperties: false
    PromotionOraclePolicy:
      type: object
      required: [required_status, verifier_name, verifier_version, verifier_artifact_digest, required_stages]
      properties:
        required_status: { type: string, enum: [verified] }
        verifier_name: { type: string, enum: [cognigraph.oracle-separation-manifest] }
        verifier_version: { type: string, enum: ['1'] }
        verifier_artifact_digest:
          type: string
          enum: ['sha256:626de8e04b7035c82e714335ed3f9cd2867b531c8a3c94e0b0f109e7cb5cabe4']
          description: Pinned operator-trusted verifier semantics identity; M18 does not fetch or cryptographically verify an external verifier binary.
        required_stages:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/PromotionOracleStageRule' }
          description: Exact order is candidate_build=false, candidate_tuning=false, construction=false, evaluation=true.
      additionalProperties: false
    ResolvedPromotionPolicy:
