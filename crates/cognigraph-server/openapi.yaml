        documents_retention_bytes: { type: integer, format: int64, enum: [100663296] }
        prepared_corpus_retention_bytes: { type: integer, format: int64, enum: [67108864] }
        max_documents: { type: integer, format: int64, enum: [100000] }
        max_raw_document_bytes: { type: integer, format: int64, enum: [4194304] }
        max_total_raw_document_bytes: { type: integer, format: int64, enum: [67108864] }
        max_normalized_document_bytes: { type: integer, format: int64, enum: [8388608] }
        max_total_normalized_bytes: { type: integer, format: int64, enum: [67108864] }
        max_chunk_bytes: { type: integer, format: int64, enum: [8192] }
        max_chunks: { type: integer, format: int64, enum: [100000] }
        max_total_prepared_text_bytes: { type: integer, format: int64, enum: [50331648] }
        yield_every_documents: { type: integer, format: int64, enum: [16] }
        plan_digest: { type: string, enum: ['sha256:ef29c26eb3bb5700dd280a2b8421d2e421216ad593e0093512c2d3f822f4dd56'] }
