        policy_revision_id: { type: string }
        policy_revision_digest: { $ref: '#/components/schemas/Sha256Digest' }
        resolved_policy_digest: { $ref: '#/components/schemas/Sha256Digest' }
        approval_id: { type: string }
        approval_digest: { $ref: '#/components/schemas/Sha256Digest' }
        approver_registration_id: { type: string }
        approver_registration_digest: { $ref: '#/components/schemas/Sha256Digest' }
        author_principal_id: { type: string }
        approver_principal_id: { type: string }
      additionalProperties: false
    GovernancePromotionIntentPayloadBase:
      type: object
      required: [requested_action, target, evidence_id, evidence_digest, policy_revision_id, policy_revision_digest, approval_id, approval_digest, gate_assessment_digest, expected_head_decision_id, rollback_target_evidence_id, reason, idempotency_key_hash, promoter_registration_id, promoter_principal_id, signed_at_ms]
      properties:
        requested_action: { type: string, enum: [promote, reject, rollback] }
        target: { $ref: '#/components/schemas/PromotionTarget' }
        evidence_id: { type: string, minLength: 1 }
        evidence_digest: { $ref: '#/components/schemas/Sha256Digest' }
        policy_revision_id: { type: string, nullable: true }
        policy_revision_digest: { allOf: [{ $ref: '#/components/schemas/Sha256Digest' }], nullable: true }
        approval_id: { type: string, nullable: true }
        approval_digest: { allOf: [{ $ref: '#/components/schemas/Sha256Digest' }], nullable: true }
        artifact_authority_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          nullable: true
          description: Required for M20-M23 evidence decisions and absent from historical M18/M19 signed intents.
        consumption_authority_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          nullable: true
          description: Required for M21-M23 evidence decisions; later domains additionally bind derivation and preparation authority.
        derivation_authority_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          nullable: true
          description: Required for M22/M23 evidence decisions under promotion-intent domains v3/v4.
        preparation_authority_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          nullable: true
          description: Required only for M23 evidence decisions under promotion-intent domain v4.
        gate_assessment_digest: { $ref: '#/components/schemas/Sha256Digest' }
        expected_head_decision_id: { type: string, nullable: true }
        rollback_target_evidence_id: { type: string, nullable: true }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        idempotency_key_hash: { $ref: '#/components/schemas/Sha256Digest' }
        promoter_registration_id: { type: string, minLength: 1 }
        promoter_principal_id: { type: string, minLength: 1 }
        signed_at_ms: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    GovernancePromotionIntentPayload:
      description: Exact authority-generation-specific signed promoter payload.
      oneOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM19' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM20' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM21' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM22' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM23' }
    GovernancePromotionIntentPayloadM19:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadBase' }
        - type: object
          not:
            anyOf:
              - { required: [artifact_authority_digest] }
              - { required: [consumption_authority_digest] }
              - { required: [derivation_authority_digest] }
              - { required: [preparation_authority_digest] }
    GovernancePromotionIntentPayloadM20:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadBase' }
        - type: object
          required: [artifact_authority_digest]
          properties:
            artifact_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
          not:
            anyOf:
              - { required: [consumption_authority_digest] }
              - { required: [derivation_authority_digest] }
              - { required: [preparation_authority_digest] }
    GovernancePromotionIntentPayloadM21:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadBase' }
        - type: object
          required: [artifact_authority_digest, consumption_authority_digest]
          properties:
            artifact_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
            consumption_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
          not:
            anyOf:
              - { required: [derivation_authority_digest] }
              - { required: [preparation_authority_digest] }
    GovernancePromotionIntentPayloadM22:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadBase' }
        - type: object
          required: [artifact_authority_digest, consumption_authority_digest, derivation_authority_digest]
          properties:
            artifact_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
            consumption_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
            derivation_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
          not:
            required: [preparation_authority_digest]
    GovernancePromotionIntentPayloadM23:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadBase' }
        - type: object
          required: [artifact_authority_digest, consumption_authority_digest, derivation_authority_digest, preparation_authority_digest]
          properties:
            artifact_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
            consumption_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
            derivation_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
            preparation_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
    GovernancePromotionIntentStatementBase:
      type: object
      required: [schema_version, domain, tenant, tenant_incarnation, payload]
      properties:
        schema_version: { type: integer, enum: [1] }
        domain:
          type: string
          enum: [cognigraph.promotion-intent.v1, cognigraph.promotion-intent.v2, cognigraph.promotion-intent.v3, cognigraph.promotion-intent.v4]
          description: v1 covers M19/M20; v2 binds M21 consumption; v3 adds M22 derivation; v4 adds M23 preparation authority.
        tenant: { type: string, minLength: 1 }
        tenant_incarnation: { type: string, minLength: 1 }
        payload: { $ref: '#/components/schemas/GovernancePromotionIntentPayload' }
      additionalProperties: false
    GovernancePromotionIntentStatement:
      description: Exact domain-specific signed promotion-intent statement.
      oneOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementV1' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementV2' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementV3' }
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementV4' }
      discriminator:
        propertyName: domain
        mapping:
          cognigraph.promotion-intent.v1: '#/components/schemas/GovernancePromotionIntentStatementV1'
          cognigraph.promotion-intent.v2: '#/components/schemas/GovernancePromotionIntentStatementV2'
          cognigraph.promotion-intent.v3: '#/components/schemas/GovernancePromotionIntentStatementV3'
          cognigraph.promotion-intent.v4: '#/components/schemas/GovernancePromotionIntentStatementV4'
    GovernancePromotionIntentStatementV1:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementBase' }
        - type: object
          properties:
            domain: { type: string, enum: [cognigraph.promotion-intent.v1] }
            payload:
              oneOf:
                - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM19' }
                - { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM20' }
    GovernancePromotionIntentStatementV2:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementBase' }
        - type: object
          properties:
            domain: { type: string, enum: [cognigraph.promotion-intent.v2] }
            payload: { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM21' }
    GovernancePromotionIntentStatementV3:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementBase' }
        - type: object
          properties:
            domain: { type: string, enum: [cognigraph.promotion-intent.v3] }
            payload: { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM22' }
    GovernancePromotionIntentStatementV4:
      allOf:
        - { $ref: '#/components/schemas/GovernancePromotionIntentStatementBase' }
        - type: object
          properties:
            domain: { type: string, enum: [cognigraph.promotion-intent.v4] }
            payload: { $ref: '#/components/schemas/GovernancePromotionIntentPayloadM23' }
