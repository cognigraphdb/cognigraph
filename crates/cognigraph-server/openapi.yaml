            application/json:
              schema: { $ref: '#/components/schemas/GovernanceKeyMutation' }
        '200':
          description: Exact idempotent replay
          headers:
            Location: { description: Dereferenceable key registration URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernanceKeyMutation' }
        '400': { description: "Malformed statement, scope, key, validity interval, or idempotency key" }
        '401': { description: Live authenticated Admin is required }
        '403': { description: "Root/possession signature is invalid, or caller/subject role, identity, or tenant does not match" }
        '404': { description: Subject user is absent from this tenant }
        '409': { description: "Immutable key identity, principal separation, or idempotency conflict" }
        '503': { description: Trust root is not configured or governance repository is unavailable }
  /api/governance/keys/{id}:
    get:
      summary: Fetch one root-certified tenant governance public key
