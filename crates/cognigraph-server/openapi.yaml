      properties:
        requested_action: { $ref: '#/components/schemas/SemanticRepairDeploymentAction' }
        target: { $ref: '#/components/schemas/PromotionTarget' }
        semantic_repair_generation_id: { $ref: '#/components/schemas/SemanticRepairGenerationId' }
        semantic_repair_generation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        impact_digest: { $ref: '#/components/schemas/Sha256Digest' }
        promotion_head_decision_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        promotion_head_projection_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_digest: { $ref: '#/components/schemas/Sha256Digest' }
        semantic_repair_revision_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        semantic_repair_revision_digest: { $ref: '#/components/schemas/Sha256Digest' }
        semantic_repair_review_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        semantic_repair_review_digest: { $ref: '#/components/schemas/Sha256Digest' }
        expected_deployment_head_decision_id:
          allOf:
            - { $ref: '#/components/schemas/SemanticRepairDeploymentDecisionId' }
          nullable: true
          description: Explicit null only when there is no currently deployed generation.
        rollback_target_generation_id:
          allOf:
            - { $ref: '#/components/schemas/SemanticRepairGenerationId' }
          nullable: true
          description: Explicit null for activate; exact retained one-step prior generation for rollback.
        reason: { type: string, minLength: 1, maxLength: 1024, description: Nonblank and control-free. }
        idempotency_key_hash: { $ref: '#/components/schemas/Sha256Digest' }
        promoter_registration_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        promoter_principal_id: { type: string, minLength: 1, maxLength: 256 }
        signed_at_ms: { type: integer, format: int64, minimum: 1, description: Must not be more than five minutes in the future. }
