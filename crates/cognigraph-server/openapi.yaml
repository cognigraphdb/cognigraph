          minItems: 1
          maxItems: 100000
          uniqueItems: true
          description: Lexicographically sorted unique evidence strings; contributes to the candidate-wide 100,000-item budget.
          items: { type: string, minLength: 1 }
        source: { type: string, minLength: 1 }
        relation: { type: string, minLength: 1 }
        target: { type: string, minLength: 1 }
        triggers:
