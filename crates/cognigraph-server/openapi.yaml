  /api/semantic-repairs/revisions/{id}/review:
    post:
      summary: Submit one independent PolicyApprover-signed approve or reject review
      description: >-
        Creates the one immutable final review identity for the named revision.
        The approver must own an active purpose-bound PolicyApprover key and
        must have a stable principal distinct from the revision author.
        Approve and reject share the same natural identity, so reconsideration
        requires a new authored revision.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/GovernanceRecordId' } }
        - { $ref: '#/components/parameters/PromotionIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewSemanticRepairRevisionRequest' }
      responses:
        '201':
          description: New immutable signed review
          headers:
            Location: { description: Review detail URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairReviewMutation' }
        '200':
          description: Exact idempotent replay
          headers:
            Location: { description: Review detail URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairReviewMutation' }
        '400': { description: "Invalid idempotency key, signed review, revision binding, decision, reason, or timestamp" }
        '401': { description: Live authenticated PolicyApprover identity is required }
        '403': { description: "Author or approver key is inactive/revoked at review admission, approver signature/ownership is invalid, or author and approver are the same stable principal; later revocation does not rewrite a review already admitted while both were active" }
        '404': { description: Revision or governance key registration is absent from this tenant incarnation }
        '409': { description: "Immutable review identity, tenant capacity, or idempotency conflict" }
        '422': { description: "Malformed JSON or request body does not match the strict signed-review shape, including omission of the required nullable base field" }
        '503': { description: Signed governance or Semantic Repair repository is unavailable }
  /api/semantic-repairs/reviews:
    get:
