        - { name: cursor, in: query, schema: { type: string }, description: Opaque tenant-incarnation-bound cursor. }
      responses:
        '200':
          description: Bounded review page in stable repository-key order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairReviewPage' }
        '400': { description: Invalid limit or cursor }
        '401': { description: Live authenticated governance reader is required }
        '403': { description: Caller does not have a tenant governance reader role }
        '404': { description: A revision or governance key referenced by a stored review is absent }
        '409': { description: "Stored review authority fails immutable shape, binding, digest, signature, or historical key validation" }
        '503': { description: Signed governance or Semantic Repair repository is unavailable }
  /api/semantic-repairs/reviews/{id}:
    get:
      summary: Fetch one immutable signed Semantic Repair review
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/GovernanceRecordId' } }
      responses:
        '200':
          description: Complete public review record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairReviewRecord' }
        '400': { description: Review identifier is invalid }
