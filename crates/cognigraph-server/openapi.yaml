        '404': { description: Review is absent from this tenant incarnation }
        '409': { description: "Stored review authority fails immutable shape, binding, digest, signature, or historical key validation" }
        '503': { description: Signed governance or Semantic Repair repository is unavailable }
  /api/semantic-repairs/current/{space_type}/{channel}:
    get:
      summary: Resolve the current promotion head to exact approved Semantic Repair authority
      description: >-
        Revalidates the existing M18-M24 promotion head and requires its exact
        selected candidate digest to match one immutable signed revision and
        one independent approve review for the same tenant, incarnation, and
        target. Missing, rejected, unselected, tampered, foreign authority, or
        a record admitted after its applicable key revocation fails closed;
        later revocation does not rewrite valid pre-revocation history. This is
        a control-plane resolution, not a deployed graph-generation switch.
      parameters:
        - { name: space_type, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' } }
        - { name: channel, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' } }
      responses:
        '200':
          description: Exact currently selected and independently approved authority
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentSemanticRepairAuthority' }
        '400': { description: Invalid target path value }
        '401': { description: Live authenticated governance reader is required }
        '403': { description: "Caller lacks a governance reader role or the author, reviewer, and promoter principals are not independent" }
        '404': { description: An immutable decision referenced by the current promotion chain is absent from this tenant incarnation }
        '409': { description: "No current head, no exactly matching final approval, selected authority is inconsistent/divergent, or a signed record was admitted after its applicable key revocation" }
        '503': { description: "Promotion, signed governance, or Semantic Repair repository is unavailable" }
  /api/semantic-repairs/generations:
    post:
      summary: Build one immutable verified Semantic Repair graph generation (Promoter)
      description: >-
        Revalidates the exact current M22/M23 promotion head, independently
        approved M25 authority, M22/M23 original and replay receipts, and
        canonical prepared corpus bytes from the configured tenant-local CAS.
        It deterministically freezes every bounded entity, chunk, mention, and
        fact-occurrence row and the exact candidate-versus-baseline semantic
        impact. Creation does not deploy the graph. Authentication is mandatory
        even when the rest of the server runs with auth disabled. M26 requires
        the single-writer Native backend with the required
        repository-and-graph atomic batch boundary.
      parameters:
        - { $ref: '#/components/parameters/PromotionIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BuildSemanticRepairGenerationRequest' }
      responses:
        '201':
          description: New immutable verified generation; no served graph rows changed
          headers:
            Location: { description: Generation detail URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairGenerationMutation' }
        '200':
          description: Exact idempotent replay of an existing immutable generation
          headers:
            Location: { description: Generation detail URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairGenerationMutation' }
        '400': { description: "Invalid idempotency key, target, expected promotion head, source artifact, materialization input, or request shape" }
        '401': { description: Live authenticated Promoter identity is required }
        '403': { description: Caller is not a Promoter or does not own the governed principal }
        '404': { description: "Current promotion, signed repair authority, source evidence, source job, receipt, or CAS artifact is absent" }
        '409': { description: "Expected authority is stale or inconsistent, replay differs, deterministic facts diverge, immutable content conflicts, or a stored authority record is malformed" }
        '422': { description: Malformed JSON or request body does not match the strict generation-build shape }
        '429':
          description: Per-generation row/byte limit or retained tenant/space generation quota is exhausted
          headers:
            Retry-After: { description: Retry delay in seconds, schema: { type: integer, enum: [1] } }
        '503': { description: "Local CAS, signed governance, promotion repository, or native atomic backend is unavailable" }
    get:
      summary: List immutable verified Semantic Repair generations (governance reader)
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 25, default: 25 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque repository key bound to this tenant incarnation and generation namespace. }
      responses:
        '200':
          description: Bounded generation page in stable repository-key order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairGenerationPage' }
        '400': { description: Invalid limit or cursor }
        '401': { description: Live authenticated governance reader is required }
        '403': { description: Caller does not have a tenant governance reader role }
        '404': { description: Authority referenced by a stored generation is absent }
        '409': { description: "Stored generation fails immutable shape, digest, source, projection, impact, or authority validation" }
        '503': { description: "Promotion, signed governance, Semantic Repair, CAS authority, or native atomic backend is unavailable" }
  /api/semantic-repairs/generations/{id}:
    get:
