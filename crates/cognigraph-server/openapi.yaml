        '403': { description: Caller does not have a tenant governance reader role }
        '404': { description: Generation or referenced immutable authority is absent from this tenant incarnation }
        '409': { description: "Stored generation fails immutable shape, digest, source, projection, impact, or authority validation" }
        '503': { description: "Promotion, signed governance, Semantic Repair, or native atomic backend is unavailable" }
  /api/semantic-repairs/generations/{id}/deploy:
    post:
      summary: Atomically deploy or roll back one verified Semantic Repair generation (Promoter)
      description: >-
        Verifies an exact domain-separated Promoter signature, stable-principal
        separation from repair authors, reviewers, and candidate/baseline
        artifact attestors, current promotion and M25 authority, and the
        ABA-safe expected deployment head. In one native atomic batch it
        replaces the target space's chunks, mentions, and fact occurrences,
        validates or inserts shared entities, appends the immutable deployment
        decision, and advances the repairable head. Rollback is limited to the
        retained one-step prior generation and requires the corresponding
        signed control-plane promotion rollback first.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/SemanticRepairGenerationId' } }
        - { $ref: '#/components/parameters/PromotionIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SemanticRepairDeploymentIntentSubmission' }
      responses:
        '200':
          description: Signed deployment committed atomically or exactly replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairDeploymentMutation' }
        '400': { description: "Invalid path identity, idempotency key, signed statement, action, target binding, required nullable field, rollback target, reason, digest, or timestamp" }
        '401': { description: Live authenticated Promoter identity is required }
        '403': { description: "Caller/key ownership or signature is invalid, governance key is inactive/revoked, or stable-principal separation of duties fails" }
        '404': { description: "Generation, current authority, governance registration, or referenced deployment authority is absent" }
        '409': { description: "Stale expected deployment head, no-op activation, invalid rollback chain, shared entity conflict, idempotency conflict, divergent authority, or malformed stored record" }
        '429':
          description: Per-space immutable deployment-decision capacity is exhausted
          headers:
            Retry-After: { description: Retry delay in seconds, schema: { type: integer, enum: [1] } }
        '422': { description: "Malformed JSON or request body does not match the strict signed deployment shape, including omission of either required nullable field" }
        '503': { description: "Promotion, signed governance, Semantic Repair, or native atomic backend is unavailable" }
