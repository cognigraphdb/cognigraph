    CorpusGraphDerivationPlan:
      type: object
      description: Exact M22/M23 prepared-corpus grounder identity and deterministic admission limits; present in consumption plan schemas 2 and 3.
      required: [schema_version, deriver_id, deriver_version, deriver_semantics_digest, derivation_abi_digest, corpus_retention_bytes, candidate_retention_bytes, graph_retention_bytes, max_chunks, max_chunk_text_bytes, max_config_items, max_grounding_work, max_chunk_grounding_work, max_derived_facts, plan_digest]
      properties:
        schema_version: { type: integer, enum: [1] }
        deriver_id: { type: string, enum: [cognigraph.prepared-corpus-grounder] }
        deriver_version: { type: string, enum: ['1'] }
        deriver_semantics_digest: { type: string, enum: ['sha256:fbcea8184ff15f198cbc22c1ffbf166cc18fa382ce554ab1fdc53f648768e5ae'] }
        derivation_abi_digest: { type: string, enum: ['sha256:f12bdec86c2368cb3018c07dcc98cd93b68ef336483c87ab1f3846b60d1d9666'] }
        corpus_retention_bytes: { type: integer, format: int64, enum: [67108864] }
        candidate_retention_bytes: { type: integer, format: int64, enum: [8388608] }
        graph_retention_bytes: { type: integer, format: int64, enum: [33554432] }
        max_chunks: { type: integer, format: int64, enum: [100000] }
        max_chunk_text_bytes: { type: integer, format: int64, enum: [1048576] }
        max_config_items: { type: integer, format: int64, enum: [100000] }
        max_grounding_work: { type: integer, format: int64, enum: [10000000] }
        max_chunk_grounding_work: { type: integer, format: int64, enum: [250000] }
        max_derived_facts: { type: integer, format: int64, enum: [100000] }
        plan_digest: { type: string, enum: ['sha256:22e20e4d05fe665976c5e3201756fd22cc372f6ae635623ffb87506ea91032de'] }
      additionalProperties: false
    ArtifactConsumptionPurpose:
      type: string
      enum: [corpus_provenance, evaluated_graph, promotion_oracle, scorer_executable, verifier_executable]
    ConsumedArtifactReceipt:
      type: object
      description: Exact-byte verification result for one slot in the pinned M21-M23 plan.
      required: [artifact_kind, purpose, attestation_id, attestation_digest, manifest_digest, entry_count, total_bytes, verified_blob_set_digest, semantic_digest]
      properties:
        artifact_kind: { $ref: '#/components/schemas/ArtifactKind' }
        purpose: { $ref: '#/components/schemas/ArtifactConsumptionPurpose' }
        attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        attestation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        entry_count: { type: integer, format: int64, minimum: 1 }
        total_bytes: { type: integer, format: int64, minimum: 1 }
        verified_blob_set_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of the manifest entries and verified content-addressed blob identities consumed for this slot.
        semantic_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Slot-specific canonical parsed-input digest, corpus manifest digest, or the scorer/verifier current_exe path-content digest pinned once at local-CAS startup; the executable value is neither loaded-code semantics nor a verifier verdict.
      additionalProperties: false
    ArtifactConsumptionReceiptBase:
      type: object
      description: >-
        Server-generated M21-M23 receipt binding five verified local-CAS inputs,
        the immutable consumption plan and context, the durable job attempt,
        and the exact evaluation result. This is an unkeyed server hash receipt:
        it does not independently authenticate server authorship until its
        evidence authority digest is bound by the later signed promotion
        intent, and it is not a remote-attestation or external-custody proof.
      required: [schema_version, digest_algorithm, resolver, tenant, tenant_incarnation, job_id, attempt, recoveries, input_digest, execution_payload_digest, eval_spec_digest, evaluation_result_digest, plan_digest, context_digest, artifact_set_digest, corpus, graph, oracle, scorer, verifier, started_at_ms, completed_at_ms, material_digest, receipt_digest]
      properties:
        schema_version: { type: integer, enum: [1, 2, 3] }
        digest_algorithm: { type: string, enum: [cognigraph-canonical-json-nfc-v1+sha256] }
        resolver: { type: string, enum: [tenant-local-cas-v1] }
        tenant: { type: string, minLength: 1 }
        tenant_incarnation: { type: string, minLength: 1 }
        job_id: { type: string, minLength: 1 }
        attempt: { type: integer, minimum: 1 }
        recoveries: { type: integer, minimum: 0 }
        input_digest: { $ref: '#/components/schemas/Sha256Digest' }
        execution_payload_digest: { $ref: '#/components/schemas/Sha256Digest' }
        eval_spec_digest: { $ref: '#/components/schemas/Sha256Digest' }
        evaluation_result_digest: { $ref: '#/components/schemas/Sha256Digest' }
        plan_digest: { $ref: '#/components/schemas/Sha256Digest' }
        context_digest: { $ref: '#/components/schemas/Sha256Digest' }
        artifact_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus:
          allOf:
            - { $ref: '#/components/schemas/ConsumedArtifactReceipt' }
          description: Must have artifact_kind corpus and purpose corpus_provenance.
        graph:
          allOf:
            - { $ref: '#/components/schemas/ConsumedArtifactReceipt' }
          description: Must have artifact_kind graph and purpose evaluated_graph.
        oracle:
          allOf:
            - { $ref: '#/components/schemas/ConsumedArtifactReceipt' }
          description: Must have artifact_kind oracle and purpose promotion_oracle.
        scorer:
          allOf:
            - { $ref: '#/components/schemas/ConsumedArtifactReceipt' }
          description: Must have artifact_kind scorer and purpose scorer_executable.
        verifier:
          allOf:
            - { $ref: '#/components/schemas/ConsumedArtifactReceipt' }
          description: Must have artifact_kind verifier and purpose verifier_executable.
        derivation:
          allOf:
            - { $ref: '#/components/schemas/CorpusGraphDerivationReceipt' }
          nullable: true
          description: Required for M22/M23 receipt schemas 2/3 and forbidden for M21 receipt schema 1.
        started_at_ms: { type: integer, format: int64, minimum: 1 }
        completed_at_ms: { type: integer, format: int64, minimum: 1 }
        material_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Deterministic digest of the plan, context, artifact set, five consumed slot receipts, and the M22/M23 derivation receipt when present; stable across an original/replay pair.
        receipt_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of this complete receipt with receipt_digest removed.
      additionalProperties: false
    ArtifactConsumptionReceipt:
      description: Exact generation-specific verified-consumption receipt.
      oneOf:
        - { $ref: '#/components/schemas/ArtifactConsumptionReceiptV1' }
        - { $ref: '#/components/schemas/ArtifactConsumptionReceiptV2' }
        - { $ref: '#/components/schemas/ArtifactConsumptionReceiptV3' }
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/ArtifactConsumptionReceiptV1'
          '2': '#/components/schemas/ArtifactConsumptionReceiptV2'
          '3': '#/components/schemas/ArtifactConsumptionReceiptV3'
    ArtifactConsumptionReceiptV1:
      allOf:
        - { $ref: '#/components/schemas/ArtifactConsumptionReceiptBase' }
        - type: object
          properties:
            schema_version: { type: integer, enum: [1] }
          not:
            required: [derivation]
    ArtifactConsumptionReceiptV2:
      allOf:
        - { $ref: '#/components/schemas/ArtifactConsumptionReceiptBase' }
        - type: object
          required: [derivation]
          properties:
            schema_version: { type: integer, enum: [2] }
            derivation: { $ref: '#/components/schemas/CorpusGraphDerivationReceiptV1' }
    ArtifactConsumptionReceiptV3:
      allOf:
        - { $ref: '#/components/schemas/ArtifactConsumptionReceiptBase' }
        - type: object
          required: [derivation]
          properties:
            schema_version: { type: integer, enum: [3] }
            derivation: { $ref: '#/components/schemas/CorpusGraphDerivationReceiptV2' }
    VerifiedGraphFact:
      type: object
      description: >-
        One canonical evidence-bearing graph row. Runtime validation additionally
        requires every value to be NFC, control-free, non-blank, and at most
        1024 UTF-8 bytes; receipt facts are sorted and unique by all four fields.
      required: [source, relation, target, evidence_chunk_id]
      properties:
        source: { type: string, minLength: 1, maxLength: 1024 }
        relation: { type: string, minLength: 1, maxLength: 1024 }
        target: { type: string, minLength: 1, maxLength: 1024 }
        evidence_chunk_id: { type: string, minLength: 1, maxLength: 1024 }
      additionalProperties: false
    RawCorpusPreparationReceipt:
      type: object
      description: >-
        Compact M23 address-durable proof that exact canonical documents.json
        bytes reproduced the signed corpus.json address. Raw bytes remain in
        the external CAS and are not embedded in jobs or snapshots.
      required: [schema_version, preparer_id, preparer_version, preparer_semantics_digest, preparation_abi_digest, preparation_plan_digest, corpus_manifest_digest, documents_blob_digest, documents_semantic_digest, raw_document_set_digest, prepared_corpus_blob_digest, prepared_corpus_semantic_digest, preparation_read_set_digest, preparation_material_digest]
      properties:
        schema_version: { type: integer, enum: [1] }
        preparer_id: { type: string, enum: [cognigraph.utf8-document-preparer] }
        preparer_version: { type: string, enum: ['1'] }
        preparer_semantics_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preparation_abi_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preparation_plan_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus_manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        documents_blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        documents_semantic_digest: { $ref: '#/components/schemas/Sha256Digest' }
        raw_document_set_digest:
          allOf: [{ $ref: '#/components/schemas/Sha256Digest' }]
          description: Must equal the signed canonical documents.json content address.
        prepared_corpus_blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        prepared_corpus_semantic_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preparation_read_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preparation_material_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    CorpusGraphDerivationReceipt:
      description: Exact generation-specific corpus-to-graph derivation receipt.
      oneOf:
        - { $ref: '#/components/schemas/CorpusGraphDerivationReceiptV1' }
        - { $ref: '#/components/schemas/CorpusGraphDerivationReceiptV2' }
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/CorpusGraphDerivationReceiptV1'
          '2': '#/components/schemas/CorpusGraphDerivationReceiptV2'
    CorpusGraphDerivationReceiptBase:
      type: object
      description: >-
        Shared M22/M23 proof projection retaining exact signed corpus, graph,
        and oracle manifest material, canonical fact rows, and verified oracle
        JSON needed to reconstruct their content addresses without dereferencing
        the CAS.
      required: [schema_version, deriver_id, deriver_version, deriver_semantics_digest, derivation_abi_digest, derivation_plan_digest, corpus_manifest, graph_manifest, oracle_manifest, corpus_manifest_digest, corpus_blob_digest, corpus_semantic_digest, candidate_blob_digest, candidate_semantic_digest, resolved_config_digest, claimed_graph_blob_digest, claimed_graph_semantic_digest, derived_graph_blob_digest, derived_graph_semantic_digest, facts_digest, fact_count, facts, oracle_json, construction_read_set_digest, derivation_material_digest]
      properties:
        schema_version: { type: integer, enum: [1, 2] }
        deriver_id: { type: string, enum: [cognigraph.prepared-corpus-grounder] }
        deriver_version: { type: string, enum: ['1'] }
        deriver_semantics_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derivation_abi_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derivation_plan_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus_manifest:
          allOf:
            - { $ref: '#/components/schemas/ArtifactManifest' }
          description: Exact signed corpus manifest projection; M22 carries one corpus.json entry and M23 carries corpus.json plus documents.json. Its canonical digest must reproduce the immutable M20 corpus binding.
        graph_manifest:
          allOf:
            - { $ref: '#/components/schemas/ArtifactManifest' }
          description: Exact signed candidate.json plus graph.json manifest projection; its canonical digest must reproduce the immutable M20 graph binding.
        oracle_manifest:
          allOf:
            - { $ref: '#/components/schemas/ArtifactManifest' }
          description: Exact signed singleton oracle manifest projection; its canonical digest must reproduce the immutable M20 oracle binding.
        corpus_manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus_blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus_semantic_digest: { $ref: '#/components/schemas/Sha256Digest' }
        chunk_count:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000
          description: Historical M22 observation; required for receipt schema 1 and forbidden for address-durable M23 receipt schema 2.
        preparation:
          allOf: [{ $ref: '#/components/schemas/RawCorpusPreparationReceipt' }]
          nullable: true
          description: Required only for M23 derivation receipt schema 2.
        candidate_blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_semantic_digest: { $ref: '#/components/schemas/Sha256Digest' }
        resolved_config_digest: { $ref: '#/components/schemas/Sha256Digest' }
        claimed_graph_blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        claimed_graph_semantic_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derived_graph_blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derived_graph_semantic_digest: { $ref: '#/components/schemas/Sha256Digest' }
        facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        fact_count: { type: integer, format: int64, minimum: 0, maximum: 100000 }
        facts:
          type: array
          maxItems: 100000
          uniqueItems: true
          description: Canonically sorted rows whose count and canonical digest must equal fact_count and facts_digest.
          items: { $ref: '#/components/schemas/VerifiedGraphFact' }
        oracle_json:
          type: string
          minLength: 1
          maxLength: 4194304
          description: >-
            Exact verified oracle.json UTF-8 bytes represented losslessly as a
            string; its byte digest and byte length must match oracle_manifest,
            and parsing must reproduce the consumed oracle semantic digest.
        construction_read_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derivation_material_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    CorpusGraphDerivationReceiptV1:
      allOf:
        - { $ref: '#/components/schemas/CorpusGraphDerivationReceiptBase' }
        - type: object
          required: [chunk_count]
          properties:
            schema_version: { type: integer, enum: [1] }
          not:
            required: [preparation]
    CorpusGraphDerivationReceiptV2:
      allOf:
        - { $ref: '#/components/schemas/CorpusGraphDerivationReceiptBase' }
        - type: object
          required: [preparation]
          properties:
            schema_version: { type: integer, enum: [2] }
            preparation: { $ref: '#/components/schemas/RawCorpusPreparationReceipt' }
          not:
            required: [chunk_count]
    EvidencePreparationAuthority:
      type: object
      description: Four-run M23 authority proving one identical raw-document preparation and prepared-corpus address.
      required: [candidate_original_preparation_digest, candidate_replay_preparation_digest, baseline_original_preparation_digest, baseline_replay_preparation_digest, raw_document_set_digest, prepared_corpus_digest, preparation_plan_digest, authority_digest]
      properties:
        candidate_original_preparation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_replay_preparation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_original_preparation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_replay_preparation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        raw_document_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        prepared_corpus_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preparation_plan_digest: { $ref: '#/components/schemas/Sha256Digest' }
        authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    EvidenceDerivationAuthority:
      description: Exact M22 or M23 four-run derivation authority.
      oneOf:
        - { $ref: '#/components/schemas/EvidenceDerivationAuthorityV1' }
        - { $ref: '#/components/schemas/EvidenceDerivationAuthorityV2' }
    EvidenceDerivationAuthorityBase:
      type: object
      description: Four-run M22/M23 derivation authority carried inside verified-consumption evidence.
      required: [candidate_original_derivation_digest, candidate_replay_derivation_digest, candidate_graph_digest, baseline_original_derivation_digest, baseline_replay_derivation_digest, baseline_graph_digest, derivation_plan_digest, authority_digest]
      properties:
        candidate_original_derivation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_replay_derivation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_graph_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_original_derivation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_replay_derivation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_graph_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derivation_plan_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preparation:
          allOf: [{ $ref: '#/components/schemas/EvidencePreparationAuthority' }]
          nullable: true
          description: Required only for M23 authority.
        authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    EvidenceDerivationAuthorityV1:
      allOf:
        - { $ref: '#/components/schemas/EvidenceDerivationAuthorityBase' }
        - type: object
          not:
            required: [preparation]
    EvidenceDerivationAuthorityV2:
      allOf:
        - { $ref: '#/components/schemas/EvidenceDerivationAuthorityBase' }
        - type: object
          required: [preparation]
          properties:
            preparation: { $ref: '#/components/schemas/EvidencePreparationAuthority' }
    EvidenceConsumptionAuthorityBase:
      type: object
      description: >-
        M21-M23 four-run verified-consumption authority. Original/replay material
        digests must match within each pair, while candidate and baseline share
        corpus, oracle, scorer, and verifier material. M22 additionally carries
        explicit derivation authority; M23 additionally binds preparation authority.
      required: [candidate_original_receipt_digest, candidate_replay_receipt_digest, candidate_material_digest, baseline_original_receipt_digest, baseline_replay_receipt_digest, baseline_material_digest, authority_digest]
      properties:
        candidate_original_receipt_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_replay_receipt_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_material_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_original_receipt_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_replay_receipt_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_material_digest: { $ref: '#/components/schemas/Sha256Digest' }
        derivation:
          allOf:
            - { $ref: '#/components/schemas/EvidenceDerivationAuthority' }
          nullable: true
          description: Required for M22/M23 evidence and absent from M21 evidence.
        authority_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of this object with authority_digest removed.
      additionalProperties: false
    EvidenceConsumptionAuthority:
      description: Exact M21-M23 four-run verified-consumption authority.
      oneOf:
        - { $ref: '#/components/schemas/EvidenceConsumptionAuthorityV1' }
        - { $ref: '#/components/schemas/EvidenceConsumptionAuthorityV2' }
        - { $ref: '#/components/schemas/EvidenceConsumptionAuthorityV3' }
    EvidenceConsumptionAuthorityV1:
      allOf:
        - { $ref: '#/components/schemas/EvidenceConsumptionAuthorityBase' }
        - type: object
          not:
            required: [derivation]
    EvidenceConsumptionAuthorityV2:
      allOf:
        - { $ref: '#/components/schemas/EvidenceConsumptionAuthorityBase' }
        - type: object
          required: [derivation]
          properties:
            derivation: { $ref: '#/components/schemas/EvidenceDerivationAuthorityV1' }
    EvidenceConsumptionAuthorityV3:
      allOf:
        - { $ref: '#/components/schemas/EvidenceConsumptionAuthorityBase' }
        - type: object
          required: [derivation]
          properties:
            derivation: { $ref: '#/components/schemas/EvidenceDerivationAuthorityV2' }
    ResolveArtifactBindingsRequest:
      type: object
      required: [corpus_attestation_id, graph_attestation_id, oracle_attestation_id, scorer_attestation_id, verifier_attestation_id]
      properties:
        corpus_attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        graph_attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        oracle_attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        scorer_attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        verifier_attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
      additionalProperties: false
    GovernanceKeyRegistrationPayload:
      type: object
      required: [registration_id, principal_id, subject_user_key, verification_key, not_before_ms, not_after_ms, signed_at_ms]
      properties:
        registration_id: { type: string, minLength: 1 }
        principal_id: { type: string, minLength: 1 }
        subject_user_key: { type: string, minLength: 1 }
        verification_key: { $ref: '#/components/schemas/GovernanceVerificationKey' }
        not_before_ms: { type: integer, format: int64, minimum: 1 }
        not_after_ms: { type: integer, format: int64, minimum: 1, nullable: true }
        signed_at_ms: { type: integer, format: int64, minimum: 1 }
