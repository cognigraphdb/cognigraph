        request_digest: { $ref: '#/components/schemas/Sha256Digest' }
        canonical_record_bytes: { type: integer, format: int64, minimum: 1, maximum: 16777216 }
        semantic_repair_generation_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    SemanticRepairGenerationCounts:
      type: object
      required: [entities, chunks, mentions, fact_occurrences, semantic_facts, impact_added, impact_removed, impact_unchanged]
      properties:
        entities: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        chunks: { type: integer, format: int64, minimum: 1, maximum: 1000 }
        mentions: { type: integer, format: int64, minimum: 0, maximum: 30000 }
        fact_occurrences: { type: integer, format: int64, minimum: 0, maximum: 30000 }
        semantic_facts: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        impact_added: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        impact_removed: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        impact_unchanged: { type: integer, format: int64, minimum: 0, maximum: 10000 }
      additionalProperties: false
    SemanticRepairGenerationSummary:
