      properties:
        _key: { type: string, minLength: 1 }
        space_id: { type: string, minLength: 1 }
        chunk_id: { type: string, minLength: 1 }
        title: { type: string }
        text: { type: string }
        content_hash: { $ref: '#/components/schemas/Sha256Digest' }
        construction_schema: { type: string, enum: [occurrence-v1] }
      additionalProperties: false
    MaterializedSemanticRepairMention:
      type: object
      required: [_key, _from, _to, relation_type, space_id, evidence_chunk_id, construction_schema]
      properties:
        _key: { type: string, minLength: 1 }
        _from: { type: string, pattern: '^chunks/.+$' }
        _to: { type: string, pattern: '^entities/.+$' }
        relation_type: { type: string, enum: [MENTIONS] }
        space_id: { type: string, minLength: 1 }
        evidence_chunk_id: { type: string, minLength: 1 }
        construction_schema: { type: string, enum: [occurrence-v1] }
      additionalProperties: false
    MaterializedSemanticRepairFactOccurrence:
      type: object
      required: [_key, _from, _to, relation_type, space_id, evidence_chunk_id, trigger, trigger_start, trigger_end, construction_schema, provenance, neuron_id, reviewed_by]
      properties:
        _key: { type: string, minLength: 1 }
        _from: { type: string, pattern: '^entities/.+$' }
        _to: { type: string, pattern: '^entities/.+$' }
        relation_type: { type: string, minLength: 1 }
        space_id: { type: string, minLength: 1 }
        evidence_chunk_id: { type: string, minLength: 1 }
        trigger: { type: string }
        trigger_start: { type: integer, minimum: 0 }
        trigger_end: { type: integer, minimum: 0 }
        construction_schema: { type: string, enum: [occurrence-v1] }
        provenance: { type: string, enum: [narrative] }
        neuron_id: { type: string, nullable: true }
        reviewed_by: { type: string, nullable: true }
      additionalProperties: false
    MaterializedSemanticRepairProjection:
      type: object
      description: Complete sorted occurrence projection for one bounded space; digest fields bind the exact row arrays and collapsed semantic fact set.
      required: [schema_version, space_id, entities, chunks, mentions, facts, entity_count, chunk_count, mention_count, fact_count, entities_digest, chunks_digest, mentions_digest, facts_digest, semantic_facts, semantic_facts_digest, projection_digest]
      properties:
        schema_version: { type: integer, enum: [1] }
        space_id: { type: string, minLength: 1 }
        entities:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/MaterializedSemanticRepairEntity' }
        chunks:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/MaterializedSemanticRepairChunk' }
        mentions:
          type: array
          maxItems: 30000
          items: { $ref: '#/components/schemas/MaterializedSemanticRepairMention' }
        facts:
          type: array
          maxItems: 30000
          items: { $ref: '#/components/schemas/MaterializedSemanticRepairFactOccurrence' }
        entity_count: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        chunk_count: { type: integer, format: int64, minimum: 1, maximum: 1000 }
        mention_count: { type: integer, format: int64, minimum: 0, maximum: 30000 }
        fact_count: { type: integer, format: int64, minimum: 0, maximum: 30000 }
        entities_digest: { $ref: '#/components/schemas/Sha256Digest' }
        chunks_digest: { $ref: '#/components/schemas/Sha256Digest' }
        mentions_digest: { $ref: '#/components/schemas/Sha256Digest' }
        facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        semantic_facts:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/VerifiedGraphFact' }
        semantic_facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        projection_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    VerifiedSemanticRepairImpact:
      type: object
      description: Exact set difference between candidate and baseline semantic facts, bound to the full candidate occurrence projection.
      required: [schema_version, candidate_facts_digest, baseline_facts_digest, added_count, removed_count, unchanged_count, added_facts, removed_facts, added_facts_digest, removed_facts_digest, candidate_occurrence_projection_digest, impact_digest]
      properties:
        schema_version: { type: integer, enum: [1] }
        candidate_facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        added_count: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        removed_count: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        unchanged_count: { type: integer, format: int64, minimum: 0, maximum: 10000 }
        added_facts:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/VerifiedGraphFact' }
        removed_facts:
          type: array
          maxItems: 10000
          items: { $ref: '#/components/schemas/VerifiedGraphFact' }
        added_facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        removed_facts_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_occurrence_projection_digest: { $ref: '#/components/schemas/Sha256Digest' }
        impact_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    SemanticRepairGenerationRecord:
      type: object
