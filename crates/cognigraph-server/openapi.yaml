  /api/semantic-repairs/revisions:
    post:
      summary: Submit one immutable PolicyAuthor-signed Semantic Repair revision
      description: >-
        Embeds the exact unchanged M22 construction candidate, recomputes its
        canonical digest, validates the active purpose-bound author key and
        authenticated principal, and stores an append-only tenant-incarnation
        record. The endpoint accepts a detached public signature but never a
        signing or private key.
      parameters:
        - { $ref: '#/components/parameters/PromotionIdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSemanticRepairRevisionRequest' }
      responses:
        '201':
          description: New immutable signed revision
          headers:
            Location: { description: Revision detail URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairRevisionMutation' }
        '200':
          description: Exact idempotent replay
          headers:
            Location: { description: Revision detail URL, schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SemanticRepairRevisionMutation' }
        '400': { description: "Invalid idempotency key, signed statement, typed candidate, target, digest, or timestamp" }
        '401': { description: Live authenticated PolicyAuthor identity is required }
        '403': { description: Caller does not own an active root-certified PolicyAuthor registration or the signature is invalid }
        '404': { description: Referenced governance key registration is absent from this tenant incarnation }
        '409': { description: "Immutable revision identity, tenant capacity, or idempotency conflict" }
        '413': { description: Signed revision request exceeds the 10 MiB transport limit; the embedded unchanged M22 candidate itself remains capped at 8 MiB }
        '422': { description: "Malformed JSON or request body does not match the strict signed-revision shape, including omission of the required nullable base field" }
        '429': { description: Per-candidate canonical JSON or deterministic candidate-configuration capacity is exceeded; Retry-After is returned }
