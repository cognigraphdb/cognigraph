    ArtifactKind:
      type: string
      enum: [corpus, graph, oracle, scorer, verifier]
    ArtifactAttestationId:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Deterministic tenant-incarnation-scoped natural identity for one manifest, usage subject, and attestor registration.
    GovernanceRecordId:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: Deterministic lowercase-hex tenant governance record identity.
    ArtifactManifestEntry:
      type: object
      required: [logical_path, media_type, byte_length, blob_digest, executable]
      properties:
        logical_path:
          type: string
          minLength: 1
          maxLength: 1024
          description: NFC relative portable path; entries are sorted by unique path and case-only aliases are rejected.
        media_type: { type: string, minLength: 1, maxLength: 256 }
        byte_length: { type: integer, format: int64, minimum: 0 }
        blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        executable: { type: boolean }
      additionalProperties: false
    ArtifactManifest:
      type: object
      description: >-
        Canonical manifest of exact external bytes. The server never
        dereferences signed locations or re-hashes remote objects; M21-M23
        instead re-hash separately operator-staged tenant-local-CAS blobs before use.
      required: [schema_version, artifact_kind, artifact_format, entries, entry_count, total_bytes]
      properties:
        schema_version: { type: integer, enum: [1] }
        artifact_kind: { $ref: '#/components/schemas/ArtifactKind' }
        artifact_format: { type: string, minLength: 1, maxLength: 256 }
        entries:
          type: array
          minItems: 1
          maxItems: 100000
          items: { $ref: '#/components/schemas/ArtifactManifestEntry' }
          description: Strictly sorted by unique NFC logical_path; the canonical JSON form is limited to 16 MiB.
        entry_count:
          type: integer
          format: int64
          minimum: 1
          maximum: 100000
          description: Must equal entries.length.
        total_bytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1099511627776
          description: Must equal the checked sum of entry byte lengths.
      additionalProperties: false
    ArtifactCorpusSubject:
      type: object
      required: [kind, revision, preprocessing_digest]
      properties:
        kind: { type: string, enum: [corpus] }
        revision: { $ref: '#/components/schemas/PromotionRevisionAttestation' }
        preprocessing_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactGraphSubject:
      type: object
      required: [kind, revision, candidate_digest, construction_config_digest, corpus_manifest_digest, preprocessing_digest]
      properties:
        kind: { type: string, enum: [graph] }
        revision: { $ref: '#/components/schemas/PromotionRevisionAttestation' }
        candidate_digest: { $ref: '#/components/schemas/Sha256Digest' }
        construction_config_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus_manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        preprocessing_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactOracleSubject:
      type: object
      required: [kind, revision, eval_spec_digest, case_manifest_digest, corpus_manifest_digest]
      properties:
        kind: { type: string, enum: [oracle] }
        revision: { $ref: '#/components/schemas/PromotionRevisionAttestation' }
        eval_spec_digest: { $ref: '#/components/schemas/Sha256Digest' }
        case_manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        corpus_manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactScorerSubject:
      type: object
      required: [kind, scorer_id, scorer_version, semantics_identity_digest, metric_semantics_version, executable_digest]
      properties:
        kind: { type: string, enum: [scorer] }
        scorer_id: { type: string, minLength: 1, maxLength: 256 }
        scorer_version: { type: string, minLength: 1, maxLength: 256 }
        semantics_identity_digest: { $ref: '#/components/schemas/Sha256Digest' }
        metric_semantics_version: { type: string, minLength: 1, maxLength: 256 }
        executable_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactVerifierSubject:
      type: object
      required: [kind, verifier_name, verifier_version, semantics_identity_digest]
      properties:
        kind: { type: string, enum: [verifier] }
        verifier_name: { type: string, minLength: 1, maxLength: 256 }
        verifier_version: { type: string, minLength: 1, maxLength: 256 }
        semantics_identity_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactSubject:
      description: Closed usage claim tying the attested bytes to one exact evaluation input identity.
      oneOf:
        - { $ref: '#/components/schemas/ArtifactCorpusSubject' }
        - { $ref: '#/components/schemas/ArtifactGraphSubject' }
        - { $ref: '#/components/schemas/ArtifactOracleSubject' }
        - { $ref: '#/components/schemas/ArtifactScorerSubject' }
        - { $ref: '#/components/schemas/ArtifactVerifierSubject' }
      discriminator:
        propertyName: kind
        mapping:
          corpus: '#/components/schemas/ArtifactCorpusSubject'
          graph: '#/components/schemas/ArtifactGraphSubject'
          oracle: '#/components/schemas/ArtifactOracleSubject'
          scorer: '#/components/schemas/ArtifactScorerSubject'
          verifier: '#/components/schemas/ArtifactVerifierSubject'
    ArtifactLocationObservation:
      type: object
      description: Signed audit locator observed by the attestor; URI reachability and remote object bytes are not server-verified.
      required: [uri, observed_at_ms]
      properties:
        uri: { type: string, minLength: 1, maxLength: 2048 }
        observed_at_ms: { type: integer, format: int64, minimum: 1 }
        object_version: { type: string, minLength: 1, maxLength: 1024, nullable: true }
        etag: { type: string, minLength: 1, maxLength: 1024, nullable: true }
        last_modified: { type: string, minLength: 1, maxLength: 1024, nullable: true }
        declared_length: { type: integer, format: int64, minimum: 0, nullable: true }
        content_encoding: { type: string, minLength: 1, maxLength: 1024, nullable: true }
      additionalProperties: false
    ArtifactAttestationPayload:
      type: object
      required: [attestation_id, manifest, manifest_digest, subject, locations, attestor_registration_id, attestor_principal_id, hash_completed_at_ms, signed_at_ms]
      properties:
        attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        manifest: { $ref: '#/components/schemas/ArtifactManifest' }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        subject: { $ref: '#/components/schemas/ArtifactSubject' }
        locations:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/ArtifactLocationObservation' }
        attestor_registration_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        attestor_principal_id: { type: string, minLength: 1, maxLength: 256 }
        hash_completed_at_ms: { type: integer, format: int64, minimum: 1 }
        signed_at_ms: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    ArtifactAttestationStatement:
      type: object
      required: [schema_version, domain, tenant, tenant_incarnation, payload]
      properties:
        schema_version: { type: integer, enum: [1] }
        domain: { type: string, enum: [cognigraph.artifact-attestation.v1] }
        tenant: { type: string, minLength: 1 }
        tenant_incarnation: { type: string, minLength: 1 }
        payload: { $ref: '#/components/schemas/ArtifactAttestationPayload' }
      additionalProperties: false
    CreateArtifactAttestationRequest:
      type: object
      description: Domain-separated ArtifactAttestor statement and detached Ed25519 signature. Private key material is never accepted.
      required: [statement, attestor_signature]
      properties:
        statement: { $ref: '#/components/schemas/ArtifactAttestationStatement' }
        attestor_signature: { $ref: '#/components/schemas/GovernanceSignatureEnvelope' }
      additionalProperties: false
    ArtifactAttestationRecord:
      type: object
      description: Immutable accepted signed attestation; storage key and idempotency-key hash are omitted from public responses.
      required: [schema_version, digest_algorithm, tenant, tenant_incarnation, attestation_id, artifact_kind, manifest, manifest_digest, subject, subject_digest, locations, attestor_registration_id, attestor_registration_digest, attestor_principal_id, root_key_id, hash_completed_at_ms, signed_at_ms, attestor_signature, accepted_by, accepted_at_ms, request_digest, attestation_digest]
      properties:
        schema_version: { type: integer, enum: [1] }
        digest_algorithm: { type: string, enum: [cognigraph-canonical-json-nfc-v1+sha256] }
        tenant: { type: string }
        tenant_incarnation: { type: string }
        attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        artifact_kind: { $ref: '#/components/schemas/ArtifactKind' }
        manifest: { $ref: '#/components/schemas/ArtifactManifest' }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        subject: { $ref: '#/components/schemas/ArtifactSubject' }
        subject_digest: { $ref: '#/components/schemas/Sha256Digest' }
        locations:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/ArtifactLocationObservation' }
        attestor_registration_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        attestor_registration_digest: { $ref: '#/components/schemas/Sha256Digest' }
        attestor_principal_id: { type: string }
        root_key_id: { type: string, pattern: '^ed25519:sha256:[0-9a-f]{64}$' }
        hash_completed_at_ms: { type: integer, format: int64, minimum: 1 }
        signed_at_ms: { type: integer, format: int64, minimum: 1 }
        attestor_signature: { $ref: '#/components/schemas/GovernanceSignatureEnvelope' }
        accepted_by: { $ref: '#/components/schemas/GovernanceActor' }
        accepted_at_ms: { type: integer, format: int64, minimum: 1 }
        request_digest: { $ref: '#/components/schemas/Sha256Digest' }
        attestation_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactAttestationMutation:
      type: object
      required: [artifact_attestation, replayed]
      properties:
        artifact_attestation: { $ref: '#/components/schemas/ArtifactAttestationRecord' }
        replayed: { type: boolean }
      additionalProperties: false
    ArtifactAttestationSummary:
      type: object
      description: Bounded list projection; use the detail route for the complete manifest, subject, locations, and detached signature.
      required: [schema_version, digest_algorithm, tenant, tenant_incarnation, attestation_id, artifact_kind, manifest_digest, subject_digest, entry_count, total_bytes, attestor_registration_id, attestor_registration_digest, attestor_principal_id, root_key_id, hash_completed_at_ms, signed_at_ms, accepted_by, accepted_at_ms, attestation_digest]
      properties:
        schema_version: { type: integer, enum: [1] }
        digest_algorithm: { type: string, enum: [cognigraph-canonical-json-nfc-v1+sha256] }
        tenant: { type: string }
        tenant_incarnation: { type: string }
        attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        artifact_kind: { $ref: '#/components/schemas/ArtifactKind' }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        subject_digest: { $ref: '#/components/schemas/Sha256Digest' }
        entry_count: { type: integer, format: int64, minimum: 1 }
        total_bytes: { type: integer, format: int64, minimum: 1 }
        attestor_registration_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        attestor_registration_digest: { $ref: '#/components/schemas/Sha256Digest' }
        attestor_principal_id: { type: string }
        root_key_id: { type: string, pattern: '^ed25519:sha256:[0-9a-f]{64}$' }
        hash_completed_at_ms: { type: integer, format: int64, minimum: 1 }
        signed_at_ms: { type: integer, format: int64, minimum: 1 }
        accepted_by: { $ref: '#/components/schemas/GovernanceActor' }
        accepted_at_ms: { type: integer, format: int64, minimum: 1 }
        attestation_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactAttestationPage:
      type: object
      required: [artifact_attestations, count, next_cursor]
      properties:
        artifact_attestations:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/ArtifactAttestationSummary' }
        count: { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }
      additionalProperties: false
    ArtifactAttestationBinding:
      type: object
      required: [kind, attestation_id, attestation_digest, manifest_digest, subject_digest, entry_count, total_bytes, attestor_registration_id, attestor_registration_digest, attestor_principal_id, root_key_id]
      properties:
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        attestation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
        subject_digest: { $ref: '#/components/schemas/Sha256Digest' }
        entry_count: { type: integer, format: int64, minimum: 1 }
        total_bytes: { type: integer, format: int64, minimum: 1 }
        attestor_registration_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        attestor_registration_digest: { $ref: '#/components/schemas/Sha256Digest' }
        attestor_principal_id: { type: string, minLength: 1 }
        root_key_id: { type: string, pattern: '^ed25519:sha256:[0-9a-f]{64}$' }
      additionalProperties: false
    ArtifactAttestationSet:
      type: object
      description: Exact active five-artifact binding copied into M20 promotion context; each slot must contain its matching kind and a distinct attestation record.
      required: [corpus, graph, oracle, scorer, verifier, set_digest]
      properties:
        corpus: { $ref: '#/components/schemas/ArtifactAttestationBinding' }
        graph: { $ref: '#/components/schemas/ArtifactAttestationBinding' }
        oracle: { $ref: '#/components/schemas/ArtifactAttestationBinding' }
        scorer: { $ref: '#/components/schemas/ArtifactAttestationBinding' }
        verifier: { $ref: '#/components/schemas/ArtifactAttestationBinding' }
        set_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    EvidenceArtifactAuthority:
      type: object
      description: Candidate and baseline five-artifact sets frozen into M20 evidence and covered by the signed promotion intent.
      required: [candidate, baseline, authority_digest]
      properties:
        candidate: { $ref: '#/components/schemas/ArtifactAttestationSet' }
        baseline: { $ref: '#/components/schemas/ArtifactAttestationSet' }
        authority_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of this object with authority_digest removed.
      additionalProperties: false
    ArtifactRecoveryAttestation:
      type: object
      description: One distinct historically valid signed attestation required by the candidate or baseline evidence binding set.
      required: [kind, attestation_id, attestation_digest, manifest_digest]
      properties:
        kind: { $ref: '#/components/schemas/ArtifactKind' }
        attestation_id: { $ref: '#/components/schemas/ArtifactAttestationId' }
        attestation_digest: { $ref: '#/components/schemas/Sha256Digest' }
        manifest_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    ArtifactRecoveryBlob:
      type: object
      description: One distinct content-addressed byte stream, sorted by digest; repeated manifest references are deduplicated only when their lengths agree.
      required: [blob_digest, byte_length]
      properties:
        blob_digest: { $ref: '#/components/schemas/Sha256Digest' }
        byte_length: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    ArtifactRecoveryPlanV1:
      type: object
      description: >-
        Deterministic, read-only recovery inventory projected from immutable
        M21-M23 promotion evidence and its historically valid signed artifact
        attestations. It neither dereferences signed locations nor reads,
        writes, backs up, restores, or proves current availability of artifact
        bytes. The digest is an inventory identity, not backup or custody proof.
      required:
        - schema_version
        - domain
        - digest_algorithm
        - tenant
        - tenant_incarnation
        - tenant_scope_digest
        - evidence_id
        - evidence_digest
        - evidence_schema_version
        - artifact_authority_digest
        - candidate_artifact_set_digest
        - baseline_artifact_set_digest
        - attestations
        - blobs
        - manifest_entry_count
        - blob_count
        - total_bytes
        - plan_digest
      properties:
        schema_version: { type: integer, enum: [1] }
        domain: { type: string, enum: [cognigraph.artifact-recovery-plan.v1] }
        digest_algorithm: { type: string, enum: [sha256] }
        tenant: { type: string, minLength: 1 }
        tenant_incarnation: { type: string, minLength: 1 }
        tenant_scope_digest: { $ref: '#/components/schemas/Sha256Digest' }
        evidence_id: { $ref: '#/components/schemas/GovernanceRecordId' }
        evidence_digest: { $ref: '#/components/schemas/Sha256Digest' }
        evidence_schema_version: { type: integer, enum: [4, 5, 6] }
        artifact_authority_digest: { $ref: '#/components/schemas/Sha256Digest' }
        candidate_artifact_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_artifact_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        attestations:
          type: array
          minItems: 5
          maxItems: 10
          items: { $ref: '#/components/schemas/ArtifactRecoveryAttestation' }
        blobs:
          type: array
          minItems: 1
          maxItems: 8192
          items: { $ref: '#/components/schemas/ArtifactRecoveryBlob' }
        manifest_entry_count: { type: integer, format: int64, minimum: 5, maximum: 20000 }
        blob_count: { type: integer, format: int64, minimum: 1, maximum: 8192 }
        total_bytes: { type: integer, format: int64, minimum: 1 }
        plan_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of this plan with plan_digest removed.
      additionalProperties: false
    ArtifactConsumptionCorpusSlotPlan:
      description: Exact generation-specific corpus slot in the pinned loader plan.
      oneOf:
        - { $ref: '#/components/schemas/ArtifactConsumptionCorpusSlotPlanV1' }
        - { $ref: '#/components/schemas/ArtifactConsumptionCorpusSlotPlanV2' }
        - { $ref: '#/components/schemas/ArtifactConsumptionCorpusSlotPlanV3' }
    ArtifactConsumptionCorpusSlotPlanV1:
      type: object
      description: M21 hash-reads the complete corpus manifest as provenance.
      required: [artifact_kind, artifact_format, mode]
      properties:
        artifact_kind: { type: string, enum: [corpus] }
        artifact_format: { type: string, enum: [cognigraph.corpus.v1] }
        mode: { type: string, enum: [complete_manifest] }
      additionalProperties: false
    ArtifactConsumptionCorpusSlotPlanV2:
      type: object
      description: M22 retains and strictly parses singleton canonical corpus.json prepared chunks.
      required: [artifact_kind, artifact_format, entrypoint, mode]
      properties:
        artifact_kind: { type: string, enum: [corpus] }
        artifact_format: { type: string, enum: [cognigraph.prepared-chunk-corpus.v1] }
        entrypoint: { type: string, enum: [corpus.json] }
        mode: { type: string, enum: [prepared_chunk_corpus_json] }
      additionalProperties: false
    ArtifactConsumptionCorpusSlotPlanV3:
      type: object
      description: M23 retains canonical corpus.json plus canonical documents.json and independently reproduces the former from exact raw bytes.
      required: [artifact_kind, artifact_format, entrypoint, auxiliary_entrypoints, mode]
      properties:
        artifact_kind: { type: string, enum: [corpus] }
        artifact_format: { type: string, enum: [cognigraph.reproducible-prepared-chunk-corpus.v1] }
        entrypoint: { type: string, enum: [corpus.json] }
        auxiliary_entrypoints:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [documents.json] }
        mode: { type: string, enum: [reproducible_prepared_chunk_corpus_package] }
      additionalProperties: false
    ArtifactConsumptionGraphSlotPlan:
      description: Exact generation-specific graph slot in the pinned loader plan.
      oneOf:
        - { $ref: '#/components/schemas/ArtifactConsumptionGraphSlotPlanV1' }
        - { $ref: '#/components/schemas/ArtifactConsumptionGraphSlotPlanV2' }
    ArtifactConsumptionGraphSlotPlanV1:
      type: object
      description: M21 parses singleton graph.json as the immutable fact set used for evaluation.
      required: [artifact_kind, artifact_format, entrypoint, mode]
      properties:
        artifact_kind: { type: string, enum: [graph] }
        artifact_format: { type: string, enum: [cognigraph.evaluation-graph.v1] }
        entrypoint: { type: string, enum: [graph.json] }
        mode: { type: string, enum: [evaluation_graph_json] }
      additionalProperties: false
    ArtifactConsumptionGraphSlotPlanV2:
      type: object
      description: M22 verifies canonical candidate.json and reconstructs canonical graph.json exactly before evaluation.
      required: [artifact_kind, artifact_format, entrypoint, auxiliary_entrypoints, mode]
      properties:
        artifact_kind: { type: string, enum: [graph] }
        artifact_format: { type: string, enum: [cognigraph.reproducible-evaluation-graph.v1] }
        entrypoint: { type: string, enum: [graph.json] }
        auxiliary_entrypoints:
          type: array
          minItems: 1
          maxItems: 1
          items: { type: string, enum: [candidate.json] }
        mode: { type: string, enum: [reproducible_evaluation_graph_package] }
      additionalProperties: false
    ArtifactConsumptionOracleSlotPlan:
      type: object
      description: The exact oracle.json entry supplies the EvalSpec used for evaluation.
      required: [artifact_kind, artifact_format, entrypoint, mode]
      properties:
        artifact_kind: { type: string, enum: [oracle] }
        artifact_format: { type: string, enum: [cognigraph.promotion-oracle.v1] }
        entrypoint: { type: string, enum: [oracle.json] }
        mode: { type: string, enum: [promotion_oracle_json] }
      additionalProperties: false
    ArtifactConsumptionScorerSlotPlan:
      type: object
      description: The scorer bytes must equal the current_exe path-content digest pinned once when local-CAS consumption is enabled at startup; no external code is loaded.
