      required: [schema_version, semantic_repair_generation_id, semantic_repair_generation_digest, target, source_evidence_id, candidate_digest, promotion_head_decision_id, semantic_repair_revision_id, semantic_repair_review_id, prepared_corpus_digest, projection_digest, impact_digest, counts, canonical_record_bytes, created_at_ms, created_by]
