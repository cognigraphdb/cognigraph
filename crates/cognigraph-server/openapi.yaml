        promoter_signature: { $ref: '#/components/schemas/GovernanceSignatureEnvelope' }
        promoter_registration: { $ref: '#/components/schemas/GovernanceKeyRecord' }
      additionalProperties: false
    SignedGovernancePromotionIntentM23:
      type: object
      description: Exact M23 promoter authority using promotion-intent.v4 and explicit preparation authority.
      required: [statement, promoter_signature, promoter_registration]
      properties:
        statement: { $ref: '#/components/schemas/GovernancePromotionIntentStatementV4' }
        promoter_signature: { $ref: '#/components/schemas/GovernanceSignatureEnvelope' }
        promoter_registration: { $ref: '#/components/schemas/GovernanceKeyRecord' }
      additionalProperties: false
    GovernanceStatus:
      type: object
      required: [schema_version, tenant, tenant_incarnation, root_configured, root_key_id, actor, private_keys_accepted]
      properties:
        schema_version: { type: integer, enum: [1] }
        tenant: { type: string }
        tenant_incarnation: { type: string }
        root_configured: { type: boolean }
        root_key_id: { type: string, pattern: '^ed25519:sha256:[0-9a-f]{64}$', nullable: true }
        actor:
          type: object
          required: [user_key, role]
          properties:
            user_key: { type: string }
            role: { type: string, enum: [admin, policy-author, policy-approver, promoter, artifact-attestor] }
          additionalProperties: false
        private_keys_accepted: { type: boolean, enum: [false] }
      additionalProperties: false
    PromotionReproducibilityContext:
      type: object
      required:
        - deterministic
        - source_commit
        - source_tree_digest
        - dirty_tree
        - executable_digest
        - toolchain
        - target
        - backend
        - backend_version
        - command_digest
        - resolved_config_digest
      properties:
        deterministic: { type: boolean, enum: [true] }
        source_commit: { type: string, minLength: 1, maxLength: 256 }
        source_tree_digest: { $ref: '#/components/schemas/Sha256Digest' }
        dirty_tree: { type: boolean, enum: [false] }
        executable_digest: { $ref: '#/components/schemas/Sha256Digest' }
        toolchain: { type: string, minLength: 1, maxLength: 256 }
        target: { type: string, minLength: 1, maxLength: 256 }
        backend:
          type: string
          enum: [native, artifact-snapshot]
          description: M18-M20 use the live Native backend identity; M21 schema 4, M22 schema 5, and M23 schema 6 require artifact-snapshot.
        backend_version: { type: string, minLength: 1, maxLength: 256 }
        command_digest: { $ref: '#/components/schemas/Sha256Digest' }
        resolved_config_digest: { $ref: '#/components/schemas/Sha256Digest' }
        seed: { type: integer, format: int64, minimum: 0, nullable: true }
        provider: { type: string, nullable: true, description: Must be null or omitted for M18 v1. }
        model: { type: string, nullable: true, description: Must be null or omitted for M18 v1. }
      additionalProperties: false
    PromotionOracleStageProjection:
      type: object
      required: [stage, read_set_digest, oracle_reads]
      properties:
        stage: { type: string, enum: [candidate_build, candidate_tuning, construction, evaluation] }
        read_set_digest: { $ref: '#/components/schemas/Sha256Digest' }
        oracle_reads: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PromotionOracleSeparationAttestation:
      type: object
      required:
        - status
        - promotion_oracle_digest
        - stage_projections
        - verifier_name
        - verifier_version
        - verifier_artifact_digest
        - verifier_run_id
        - attested_by
        - verified_at_ms
        - attestation_uri
        - attestation_digest
        - overlapping_document_ids
        - overlapping_case_ids
        - overlapping_content_digests
        - overlapping_artifact_digests
      properties:
        status: { type: string, enum: [verified, failed, unverifiable] }
        promotion_oracle_digest: { $ref: '#/components/schemas/Sha256Digest' }
        stage_projections:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/PromotionOracleStageProjection' }
          description: Sorted unique stage projections; forbidden-stage oracle read counts must be zero.
        verifier_name: { type: string, enum: [cognigraph.oracle-separation-manifest] }
        verifier_version: { type: string, enum: ['1'] }
        verifier_artifact_digest:
          type: string
          enum: ['sha256:626de8e04b7035c82e714335ed3f9cd2867b531c8a3c94e0b0f109e7cb5cabe4']
          description: Pinned operator-trusted verifier semantics identity; M18 does not fetch or cryptographically verify an external verifier binary.
        verifier_run_id: { type: string, minLength: 1, maxLength: 256 }
        attested_by: { type: string, enum: [cognigraph.oracle-separation-manifest] }
        verified_at_ms: { type: integer, format: int64, minimum: 1 }
        attestation_uri: { type: string, minLength: 1, maxLength: 2048 }
        attestation_digest:
          allOf:
            - { $ref: '#/components/schemas/Sha256Digest' }
          description: Canonical digest of this object with `attestation_digest` removed.
        overlapping_document_ids: { type: integer, format: int64, minimum: 0 }
        overlapping_case_ids: { type: integer, format: int64, minimum: 0 }
        overlapping_content_digests: { type: integer, format: int64, minimum: 0 }
        overlapping_artifact_digests: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PromotionContextBase:
      type: object
      description: >-
        Frozen evaluation identity and gate context. M18 schema 1 remains
        readable; M19 schema 2 requires the exact independently approved policy
        governance binding; M20 schema 3 additionally requires the exact active
        five-artifact attestation set; M21 schema 4 additionally requires the
        exact pinned verified-consumption plan and an artifact-snapshot
        reproducibility backend; M22 schema 5 requires the pinned v2 plan and
        exact prepared-corpus derivation; M23 schema 6 requires the pinned v3
        preparation plan and exact raw-document reproduction. Every object in this tree is closed to unknown
        fields and active authority is rechecked before admission and consumption.
      required:
        - schema_version
        - target
        - candidate
        - effective_configuration
        - revisions
        - case_manifest
        - policy
        - reproducibility
        - oracle_separation
      properties:
        schema_version: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        target: { $ref: '#/components/schemas/PromotionTarget' }
        candidate: { $ref: '#/components/schemas/PromotionCandidateIdentity' }
        effective_configuration: { $ref: '#/components/schemas/PromotionEffectiveConfiguration' }
        revisions: { $ref: '#/components/schemas/PromotionRevisionSet' }
        case_manifest: { $ref: '#/components/schemas/PromotionCaseManifest' }
        policy: { $ref: '#/components/schemas/ResolvedPromotionPolicy' }
        governance:
          allOf:
            - { $ref: '#/components/schemas/PolicyGovernanceBinding' }
          nullable: true
          description: Required for schemas 2-6 and forbidden for schema 1.
        artifact_attestations:
          allOf:
            - { $ref: '#/components/schemas/ArtifactAttestationSet' }
          nullable: true
          description: Required for schemas 3-6 and forbidden for schemas 1 and 2.
        consumption_plan:
          allOf:
            - { $ref: '#/components/schemas/ArtifactConsumptionPlan' }
          nullable: true
          description: Required for M21-M23 schemas 4-6 and forbidden for schemas 1-3; the complete value must equal its pinned generation.
        reproducibility: { $ref: '#/components/schemas/PromotionReproducibilityContext' }
        oracle_separation: { $ref: '#/components/schemas/PromotionOracleSeparationAttestation' }
      additionalProperties: false
    PromotionContext:
      description: Exact generation-specific frozen promotion context.
      oneOf:
        - { $ref: '#/components/schemas/PromotionContextV1' }
        - { $ref: '#/components/schemas/PromotionContextV2' }
        - { $ref: '#/components/schemas/PromotionContextV3' }
        - { $ref: '#/components/schemas/PromotionContextV4' }
        - { $ref: '#/components/schemas/PromotionContextV5' }
        - { $ref: '#/components/schemas/PromotionContextV6' }
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/PromotionContextV1'
          '2': '#/components/schemas/PromotionContextV2'
          '3': '#/components/schemas/PromotionContextV3'
          '4': '#/components/schemas/PromotionContextV4'
          '5': '#/components/schemas/PromotionContextV5'
          '6': '#/components/schemas/PromotionContextV6'
    PromotionContextV1:
      allOf:
        - { $ref: '#/components/schemas/PromotionContextBase' }
        - type: object
          properties:
            schema_version: { type: integer, enum: [1] }
            reproducibility:
              allOf:
                - { $ref: '#/components/schemas/PromotionReproducibilityContext' }
                - type: object
                  properties:
                    backend: { type: string, enum: [native] }
          not:
            anyOf:
              - { required: [governance] }
              - { required: [artifact_attestations] }
              - { required: [consumption_plan] }
    PromotionContextV2:
      allOf:
        - { $ref: '#/components/schemas/PromotionContextBase' }
        - type: object
          required: [governance]
          properties:
            schema_version: { type: integer, enum: [2] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            reproducibility:
              allOf:
                - { $ref: '#/components/schemas/PromotionReproducibilityContext' }
                - type: object
                  properties:
                    backend: { type: string, enum: [native] }
          not:
            anyOf:
              - { required: [artifact_attestations] }
              - { required: [consumption_plan] }
    PromotionContextV3:
      allOf:
        - { $ref: '#/components/schemas/PromotionContextBase' }
        - type: object
          required: [governance, artifact_attestations]
          properties:
            schema_version: { type: integer, enum: [3] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/ArtifactAttestationSet' }
            reproducibility:
              allOf:
                - { $ref: '#/components/schemas/PromotionReproducibilityContext' }
                - type: object
                  properties:
                    backend: { type: string, enum: [native] }
          not:
            required: [consumption_plan]
    PromotionContextV4:
      allOf:
        - { $ref: '#/components/schemas/PromotionContextBase' }
        - type: object
          required: [governance, artifact_attestations, consumption_plan]
          properties:
            schema_version: { type: integer, enum: [4] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/ArtifactAttestationSet' }
            consumption_plan:
              allOf:
                - { $ref: '#/components/schemas/ArtifactConsumptionPlan' }
                - type: object
                  properties:
                    schema_version: { type: integer, enum: [1] }
            reproducibility:
              allOf:
                - { $ref: '#/components/schemas/PromotionReproducibilityContext' }
                - type: object
                  properties:
                    backend: { type: string, enum: [artifact-snapshot] }
    PromotionContextV5:
      allOf:
        - { $ref: '#/components/schemas/PromotionContextBase' }
        - type: object
          required: [governance, artifact_attestations, consumption_plan]
          properties:
            schema_version: { type: integer, enum: [5] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/ArtifactAttestationSet' }
            consumption_plan:
              allOf:
                - { $ref: '#/components/schemas/ArtifactConsumptionPlan' }
                - type: object
                  properties:
                    schema_version: { type: integer, enum: [2] }
            reproducibility:
              allOf:
                - { $ref: '#/components/schemas/PromotionReproducibilityContext' }
                - type: object
                  properties:
                    backend: { type: string, enum: [artifact-snapshot] }
    PromotionContextV6:
      allOf:
        - { $ref: '#/components/schemas/PromotionContextBase' }
        - type: object
          required: [governance, artifact_attestations, consumption_plan]
          properties:
            schema_version: { type: integer, enum: [6] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/ArtifactAttestationSet' }
            consumption_plan:
              allOf:
                - { $ref: '#/components/schemas/ArtifactConsumptionPlanV3' }
            reproducibility:
              allOf:
                - { $ref: '#/components/schemas/PromotionReproducibilityContext' }
                - type: object
                  properties:
                    backend: { type: string, enum: [artifact-snapshot] }
    PromotionTarget:
      type: object
      required: [space_type, channel]
      properties:
        space_type: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
        channel: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9._-]+$' }
      additionalProperties: false
    PromotionEvidenceRequest:
      type: object
      additionalProperties: false
      required:
        - candidate_original_job_id
        - candidate_replay_job_id
        - baseline_original_job_id
        - baseline_replay_job_id
        - expected_head_decision_id
      properties:
        candidate_original_job_id: { type: string, minLength: 1 }
        candidate_replay_job_id: { type: string, minLength: 1 }
        baseline_original_job_id: { type: string, minLength: 1 }
        baseline_replay_job_id: { type: string, minLength: 1 }
        expected_head_decision_id:
          type: string
          nullable: true
          description: Exact active promotion decision observed for this target; null only for a target with no head.
    PromotionCountMetric:
      type: object
      required: [found, total]
      properties:
        found: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PromotionViolationMetric:
      type: object
      required: [violations, total]
      properties:
        violations: { type: integer, format: int64, minimum: 0 }
        total: { type: integer, format: int64, minimum: 0 }
      additionalProperties: false
    PromotionEvaluationSourceBase:
      type: object
      description: Frozen successful evaluation-job source copied into an evidence run.
      required: [job_id, attempt, recoveries, actor, input_digest, execution_payload_digest, eval_spec_digest, context_digest, result_digest, context, recall, restraint, missing, violations, finished_at_ms]
      properties:
        job_id: { type: string, minLength: 1 }
        attempt: { type: integer, minimum: 1 }
        recoveries: { type: integer, minimum: 0 }
        actor: { $ref: '#/components/schemas/JobActor' }
        input_digest: { $ref: '#/components/schemas/Sha256Digest' }
        execution_payload_digest: { $ref: '#/components/schemas/Sha256Digest' }
        eval_spec_digest: { $ref: '#/components/schemas/Sha256Digest' }
        context_digest: { $ref: '#/components/schemas/Sha256Digest' }
        result_digest: { $ref: '#/components/schemas/Sha256Digest' }
        artifact_consumption:
          allOf:
            - { $ref: '#/components/schemas/ArtifactConsumptionReceipt' }
          nullable: true
          description: Required when context.schema_version is 4, 5, or 6 and forbidden for schemas 1-3.
        context: { $ref: '#/components/schemas/PromotionContext' }
        recall: { $ref: '#/components/schemas/PromotionCountMetric' }
        restraint: { $ref: '#/components/schemas/PromotionViolationMetric' }
        missing: { type: array, items: { type: string } }
        violations: { type: array, items: { type: string } }
        finished_at_ms: { type: integer, format: int64, minimum: 1 }
      additionalProperties: false
    PromotionEvaluationSource:
      description: Exact authority-generation-specific frozen evaluation source.
      oneOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceV1' }
        - { $ref: '#/components/schemas/PromotionEvaluationSourceV2' }
        - { $ref: '#/components/schemas/PromotionEvaluationSourceV3' }
        - { $ref: '#/components/schemas/PromotionEvaluationSourceV4' }
        - { $ref: '#/components/schemas/PromotionEvaluationSourceV5' }
        - { $ref: '#/components/schemas/PromotionEvaluationSourceV6' }
    PromotionEvaluationSourceV1:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceBase' }
        - type: object
          properties:
            context: { $ref: '#/components/schemas/PromotionContextV1' }
          not:
            required: [artifact_consumption]
    PromotionEvaluationSourceV2:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceBase' }
        - type: object
          properties:
            context: { $ref: '#/components/schemas/PromotionContextV2' }
          not:
            required: [artifact_consumption]
    PromotionEvaluationSourceV3:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceBase' }
        - type: object
          properties:
            context: { $ref: '#/components/schemas/PromotionContextV3' }
          not:
            required: [artifact_consumption]
    PromotionEvaluationSourceV4:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceBase' }
        - type: object
          required: [artifact_consumption]
          properties:
            context: { $ref: '#/components/schemas/PromotionContextV4' }
            artifact_consumption: { $ref: '#/components/schemas/ArtifactConsumptionReceiptV1' }
    PromotionEvaluationSourceV5:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceBase' }
        - type: object
          required: [artifact_consumption]
          properties:
            context: { $ref: '#/components/schemas/PromotionContextV5' }
            artifact_consumption: { $ref: '#/components/schemas/ArtifactConsumptionReceiptV2' }
    PromotionEvaluationSourceV6:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvaluationSourceBase' }
        - type: object
          required: [artifact_consumption]
          properties:
            context: { $ref: '#/components/schemas/PromotionContextV6' }
            artifact_consumption: { $ref: '#/components/schemas/ArtifactConsumptionReceiptV3' }
    PromotionEvidenceRunBase:
      type: object
      required: [role, source]
      properties:
        role: { type: string, enum: [candidate_original, candidate_replay, baseline_original, baseline_replay] }
        source: { $ref: '#/components/schemas/PromotionEvaluationSource' }
      additionalProperties: false
    PromotionEvidenceRun:
      description: Exact authority-generation-specific evidence run.
      oneOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunV1' }
        - { $ref: '#/components/schemas/PromotionEvidenceRunV2' }
        - { $ref: '#/components/schemas/PromotionEvidenceRunV3' }
        - { $ref: '#/components/schemas/PromotionEvidenceRunV4' }
        - { $ref: '#/components/schemas/PromotionEvidenceRunV5' }
        - { $ref: '#/components/schemas/PromotionEvidenceRunV6' }
    PromotionEvidenceRunV1:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunBase' }
        - type: object
          properties:
            source: { $ref: '#/components/schemas/PromotionEvaluationSourceV1' }
    PromotionEvidenceRunV2:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunBase' }
        - type: object
          properties:
            source: { $ref: '#/components/schemas/PromotionEvaluationSourceV2' }
    PromotionEvidenceRunV3:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunBase' }
        - type: object
          properties:
            source: { $ref: '#/components/schemas/PromotionEvaluationSourceV3' }
    PromotionEvidenceRunV4:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunBase' }
        - type: object
          properties:
            source: { $ref: '#/components/schemas/PromotionEvaluationSourceV4' }
    PromotionEvidenceRunV5:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunBase' }
        - type: object
          properties:
            source: { $ref: '#/components/schemas/PromotionEvaluationSourceV5' }
    PromotionEvidenceRunV6:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceRunBase' }
        - type: object
          properties:
            source: { $ref: '#/components/schemas/PromotionEvaluationSourceV6' }
    PromotionGateResult:
      type: object
      required: [passed, reasons]
      properties:
        passed: { type: boolean }
        reasons: { type: array, items: { type: string } }
      additionalProperties: false
    PromotionGateAssessment:
      type: object
      required: [pair_reproducibility, baseline_comparability, denominators, recall, restraint, oracle_separation, overall_passed]
      properties:
        pair_reproducibility: { $ref: '#/components/schemas/PromotionGateResult' }
        baseline_comparability: { $ref: '#/components/schemas/PromotionGateResult' }
        denominators: { $ref: '#/components/schemas/PromotionGateResult' }
        recall: { $ref: '#/components/schemas/PromotionGateResult' }
        restraint: { $ref: '#/components/schemas/PromotionGateResult' }
        oracle_separation: { $ref: '#/components/schemas/PromotionGateResult' }
        overall_passed: { type: boolean }
      additionalProperties: false
    PromotionEvidenceBase:
      type: object
      description: >-
        Immutable four-job evidence bundle. The complete record includes frozen
        candidate, baseline, policy, revision, reproducibility, denominator,
        recall, restraint, and oracle-separation projections. M21 schema 4 binds
        verified consumption; M22 schema 5 additionally binds derivation authority;
        M23 schema 6 additionally binds raw-document preparation authority.
      required: [schema_version, digest_algorithm, id, tenant, tenant_incarnation, target, created_at_ms, created_by, request_digest, evidence_digest, expected_head_decision_id, rollback_target_evidence_id, candidate_digest, baseline_candidate_digest, policy, policy_digest, runs, gates]
      properties:
        schema_version: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        digest_algorithm: { type: string, enum: [cognigraph-canonical-json-nfc-v1+sha256] }
        id: { type: string, minLength: 1 }
        tenant: { type: string, minLength: 1 }
        tenant_incarnation: { type: string, minLength: 1 }
        target: { $ref: '#/components/schemas/PromotionTarget' }
        created_at_ms: { type: integer, format: int64, minimum: 1 }
        created_by: { $ref: '#/components/schemas/PromotionActor' }
        request_digest: { $ref: '#/components/schemas/Sha256Digest' }
        evidence_digest: { $ref: '#/components/schemas/Sha256Digest' }
        expected_head_decision_id: { type: string, nullable: true }
        rollback_target_evidence_id: { type: string, nullable: true }
        candidate_digest: { $ref: '#/components/schemas/Sha256Digest' }
        baseline_candidate_digest: { $ref: '#/components/schemas/Sha256Digest' }
        policy: { $ref: '#/components/schemas/ResolvedPromotionPolicy' }
        policy_digest: { $ref: '#/components/schemas/Sha256Digest' }
        governance:
          allOf:
            - { $ref: '#/components/schemas/PolicyGovernanceBinding' }
          nullable: true
          description: Present on M19-M23 governed evidence; absent on diagnostic legacy M18 evidence.
        artifact_attestations:
          allOf:
            - { $ref: '#/components/schemas/EvidenceArtifactAuthority' }
          nullable: true
          description: Present on M20-M23 evidence; absent on historical M18/M19 evidence.
        artifact_consumption:
          allOf:
            - { $ref: '#/components/schemas/EvidenceConsumptionAuthority' }
          nullable: true
          description: Required on M21-M23 schemas 4-6 and forbidden on schemas 1-3; later generations include nested derivation and preparation authority.
        runs:
          type: array
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/PromotionEvidenceRun' }
        gates: { $ref: '#/components/schemas/PromotionGateAssessment' }
      additionalProperties: false
    PromotionEvidence:
      description: Exact generation-specific immutable four-job evidence bundle.
      oneOf:
        - { $ref: '#/components/schemas/PromotionEvidenceV1' }
        - { $ref: '#/components/schemas/PromotionEvidenceV2' }
        - { $ref: '#/components/schemas/PromotionEvidenceV3' }
        - { $ref: '#/components/schemas/PromotionEvidenceV4' }
        - { $ref: '#/components/schemas/PromotionEvidenceV5' }
        - { $ref: '#/components/schemas/PromotionEvidenceV6' }
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/PromotionEvidenceV1'
          '2': '#/components/schemas/PromotionEvidenceV2'
          '3': '#/components/schemas/PromotionEvidenceV3'
          '4': '#/components/schemas/PromotionEvidenceV4'
          '5': '#/components/schemas/PromotionEvidenceV5'
          '6': '#/components/schemas/PromotionEvidenceV6'
    PromotionEvidenceV1:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceBase' }
        - type: object
          properties:
            schema_version: { type: integer, enum: [1] }
            created_by:
              allOf:
                - { $ref: '#/components/schemas/PromotionActor' }
                - type: object
                  properties:
                    role: { type: string, enum: [admin] }
            runs:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/PromotionEvidenceRunV1' }
          not:
            anyOf:
              - { required: [governance] }
              - { required: [artifact_attestations] }
              - { required: [artifact_consumption] }
    PromotionEvidenceV2:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceBase' }
        - type: object
          required: [governance]
          properties:
            schema_version: { type: integer, enum: [2] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            created_by:
              allOf:
                - { $ref: '#/components/schemas/PromotionActor' }
                - type: object
                  properties:
                    role: { type: string, enum: [promoter] }
            runs:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/PromotionEvidenceRunV2' }
          not:
            anyOf:
              - { required: [artifact_attestations] }
              - { required: [artifact_consumption] }
    PromotionEvidenceV3:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceBase' }
        - type: object
          required: [governance, artifact_attestations]
          properties:
            schema_version: { type: integer, enum: [3] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/EvidenceArtifactAuthority' }
            created_by:
              allOf:
                - { $ref: '#/components/schemas/PromotionActor' }
                - type: object
                  properties:
                    role: { type: string, enum: [promoter] }
            runs:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/PromotionEvidenceRunV3' }
          not:
            required: [artifact_consumption]
    PromotionEvidenceV4:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceBase' }
        - type: object
          required: [governance, artifact_attestations, artifact_consumption]
          properties:
            schema_version: { type: integer, enum: [4] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/EvidenceArtifactAuthority' }
            artifact_consumption: { $ref: '#/components/schemas/EvidenceConsumptionAuthorityV1' }
            created_by:
              allOf:
                - { $ref: '#/components/schemas/PromotionActor' }
                - type: object
                  properties:
                    role: { type: string, enum: [promoter] }
            runs:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/PromotionEvidenceRunV4' }
    PromotionEvidenceV5:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceBase' }
        - type: object
          required: [governance, artifact_attestations, artifact_consumption]
          properties:
            schema_version: { type: integer, enum: [5] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/EvidenceArtifactAuthority' }
            artifact_consumption: { $ref: '#/components/schemas/EvidenceConsumptionAuthorityV2' }
            created_by:
              allOf:
                - { $ref: '#/components/schemas/PromotionActor' }
                - type: object
                  properties:
                    role: { type: string, enum: [promoter] }
            runs:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/PromotionEvidenceRunV5' }
    PromotionEvidenceV6:
      allOf:
        - { $ref: '#/components/schemas/PromotionEvidenceBase' }
        - type: object
          required: [governance, artifact_attestations, artifact_consumption]
          properties:
            schema_version: { type: integer, enum: [6] }
            governance: { $ref: '#/components/schemas/PolicyGovernanceBinding' }
            artifact_attestations: { $ref: '#/components/schemas/EvidenceArtifactAuthority' }
            artifact_consumption: { $ref: '#/components/schemas/EvidenceConsumptionAuthorityV3' }
            created_by:
              allOf:
                - { $ref: '#/components/schemas/PromotionActor' }
                - type: object
                  properties:
                    role: { type: string, enum: [promoter] }
            runs:
              type: array
              minItems: 4
              maxItems: 4
              items: { $ref: '#/components/schemas/PromotionEvidenceRunV6' }
    PromotionEvidenceSubmission:
      type: object
      required: [evidence, replayed]
      properties:
        evidence: { $ref: '#/components/schemas/PromotionEvidence' }
        replayed: { type: boolean }
    PromotionEvidencePage:
      type: object
      required: [evidence, count, next_cursor]
      properties:
        evidence: { type: array, items: { $ref: '#/components/schemas/PromotionEvidence' } }
        count: { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }
    PromotionDecisionAction:
      type: string
      enum: [promote, reject, blocked, rollback]
    PromotionActor:
      type: object
      required: [user_key, username, role]
      properties:
        user_key: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, promoter] }
      additionalProperties: false
    PromotionSelection:
      type: object
      required: [generation, evidence_id, evidence_digest, candidate_digest, policy_digest]
      properties:
        generation: { type: integer, format: int64, minimum: 1 }
        evidence_id: { type: string }
        evidence_digest: { type: string }
        candidate_digest: { type: string }
        policy_digest: { type: string }
        prior_evidence_id: { type: string, nullable: true }
    PromotionDecisionBase:
      type: object
      description: >-
        Immutable attributed promotion decision; head-changing decisions form
        the authoritative target chain. Schema 4 is M21 and requires a signed
        promotion-intent.v2 governance statement whose payload binds consumption;
        schema 5 is M22 and requires promotion-intent.v3 derivation authority;
        schema 6 is M23 and requires promotion-intent.v4 preparation authority.
      required: [id, schema_version, digest_algorithm, tenant, tenant_incarnation, action, target, actor, reason, created_at_ms, request_digest, decision_digest, evidence_id, evidence_digest, policy_digest, gate_assessment_digest, expected_head_decision_id, predecessor_decision_id, resulting_selection]
      properties:
        id: { type: string }
        schema_version: { type: integer, enum: [1, 2, 3, 4, 5, 6] }
        digest_algorithm: { type: string, enum: [cognigraph-canonical-json-nfc-v1+sha256] }
        tenant: { type: string }
        tenant_incarnation: { type: string }
        action: { $ref: '#/components/schemas/PromotionDecisionAction' }
        target: { $ref: '#/components/schemas/PromotionTarget' }
        actor: { $ref: '#/components/schemas/PromotionActor' }
        reason: { type: string, minLength: 1, maxLength: 1024 }
        request_digest: { $ref: '#/components/schemas/Sha256Digest' }
        decision_digest: { $ref: '#/components/schemas/Sha256Digest' }
        evidence_id: { type: string }
        evidence_digest: { $ref: '#/components/schemas/Sha256Digest' }
        policy_digest: { $ref: '#/components/schemas/Sha256Digest' }
        gate_assessment_digest: { $ref: '#/components/schemas/Sha256Digest' }
        expected_head_decision_id: { type: string, nullable: true }
        predecessor_decision_id: { type: string, nullable: true }
        governance:
          allOf:
            - { $ref: '#/components/schemas/SignedGovernancePromotionIntent' }
          nullable: true
          description: Exact signed promoter authority for M19-M23 decisions; absent on historical M18 decisions. M21 uses domain v2, M22 v3, and M23 v4 with explicit preparation authority.
        resulting_selection:
          type: object
          allOf:
            - { $ref: '#/components/schemas/PromotionSelection' }
          nullable: true
        created_at_ms: { type: integer, format: int64 }
      additionalProperties: false
    PromotionDecision:
      description: Exact authority-generation-specific immutable promotion decision.
      oneOf:
        - { $ref: '#/components/schemas/PromotionDecisionV1ToV5' }
        - { $ref: '#/components/schemas/PromotionDecisionV6' }
      discriminator:
        propertyName: schema_version
        mapping:
          '1': '#/components/schemas/PromotionDecisionV1ToV5'
          '2': '#/components/schemas/PromotionDecisionV1ToV5'
          '3': '#/components/schemas/PromotionDecisionV1ToV5'
          '4': '#/components/schemas/PromotionDecisionV1ToV5'
          '5': '#/components/schemas/PromotionDecisionV1ToV5'
          '6': '#/components/schemas/PromotionDecisionV6'
    PromotionDecisionV1ToV5:
      allOf:
        - { $ref: '#/components/schemas/PromotionDecisionBase' }
        - type: object
          properties:
            schema_version: { type: integer, enum: [1, 2, 3, 4, 5] }
    PromotionDecisionV6:
      allOf:
        - { $ref: '#/components/schemas/PromotionDecisionBase' }
        - type: object
          required: [governance]
          properties:
            schema_version: { type: integer, enum: [6] }
            governance: { $ref: '#/components/schemas/SignedGovernancePromotionIntentM23' }
    PromotionDecisionSubmission:
      type: object
      required: [decision, replayed, head_changed]
      properties:
        decision: { $ref: '#/components/schemas/PromotionDecision' }
        replayed: { type: boolean }
        head_changed:
          type: boolean
          description: True when the operation has a resulting selection; a blocked or rejected decision leaves the head unchanged.
    PromotionDecisionPage:
      type: object
      required: [decisions, count, next_cursor]
      properties:
        decisions: { type: array, items: { $ref: '#/components/schemas/PromotionDecision' } }
        count: { type: integer, minimum: 0 }
        next_cursor: { type: string, nullable: true }
    PromotionHead:
      type: object
      description: Repairable projection of the authoritative decision chain; schemas 2, 3, and 4 are emitted for M21, M22, and M23.
      required: [schema_version, digest_algorithm, tenant, tenant_incarnation, target, applied_decision_id, selection, updated_at_ms, projection_digest]
      properties:
        schema_version: { type: integer, enum: [1, 2, 3, 4] }
        digest_algorithm: { type: string, enum: [cognigraph-canonical-json-nfc-v1+sha256] }
        tenant: { type: string }
        tenant_incarnation: { type: string }
        target: { $ref: '#/components/schemas/PromotionTarget' }
        applied_decision_id: { type: string }
        selection: { $ref: '#/components/schemas/PromotionSelection' }
        updated_at_ms: { type: integer, format: int64 }
        projection_digest: { $ref: '#/components/schemas/Sha256Digest' }
      additionalProperties: false
    PromotionCurrent:
      type: object
      required: [head]
      properties:
        head:
          type: object
          allOf:
            - { $ref: '#/components/schemas/PromotionHead' }
          nullable: true
          description: Null when this tenant incarnation has no promoted head for the target.
    PromotionOperatorStatus:
      type: object
      required:
        - tenant
        - tenant_incarnation
        - healthy
        - health_error
        - evidence_bundles
        - m20_evidence_bundles
        - m21_evidence_bundles
        - m22_evidence_bundles
        - m23_evidence_bundles
        - decisions
        - active_heads
        - artifact_attestations
        - artifact_attestations_by_kind
        - full_validation_performed
        - repair_required
        - singleton_writer
        - high_availability
      properties:
        tenant: { type: string }
        tenant_incarnation: { type: string }
        healthy: { type: boolean }
        health_error: { type: string, nullable: true }
        evidence_bundles: { type: integer, minimum: 0 }
        m20_evidence_bundles: { type: integer, minimum: 0 }
        m21_evidence_bundles: { type: integer, minimum: 0 }
        m22_evidence_bundles: { type: integer, minimum: 0 }
        m23_evidence_bundles: { type: integer, minimum: 0 }
        decisions: { type: integer, minimum: 0 }
        active_heads: { type: integer, minimum: 0 }
        artifact_attestations: { type: integer, minimum: 0 }
        artifact_attestations_by_kind:
          type: object
          required: [corpus, graph, oracle, scorer, verifier]
          properties:
            corpus: { type: integer, minimum: 0 }
            graph: { type: integer, minimum: 0 }
            oracle: { type: integer, minimum: 0 }
            scorer: { type: integer, minimum: 0 }
            verifier: { type: integer, minimum: 0 }
          additionalProperties: false
        full_validation_performed: { type: boolean, enum: [true] }
        repair_required: { type: boolean }
        singleton_writer: { type: boolean, enum: [true] }
        high_availability: { type: boolean, enum: [false] }
    PromotionReconcileResult:
      type: object
      required: [target, dry_run, decisions_scanned, head_changed, head]
      properties:
        target: { $ref: '#/components/schemas/PromotionTarget' }
        dry_run: { type: boolean }
        decisions_scanned: { type: integer, minimum: 0 }
        head_changed: { type: boolean }
        head:
          type: object
          allOf:
            - { $ref: '#/components/schemas/PromotionHead' }
          nullable: true
    PromotionRecoveryResult:
      type: object
      required: [tenant, tenant_incarnation, repaired_heads, healthy]
      properties:
        tenant: { type: string }
        tenant_incarnation: { type: string }
        repaired_heads: { type: integer, minimum: 0 }
        healthy: { type: boolean, enum: [true] }
      additionalProperties: false
    PromotionHealth:
      type: object
      required: [status, promotions, error]
      properties:
        status: { type: string, enum: [ok, error] }
        promotions: { type: string, enum: [ready, unavailable] }
        error: { type: string, nullable: true }
    Error:
      type: object
      properties:
        error: { type: string }
        code: { type: string, description: Optional machine-readable error code; enterprise_feature_required for Community edition admission. }
paths:
  /health:
    get:
      summary: Liveness including build edition (community or enterprise) and package version
      security: []
      responses:
        '200': { description: OK }
  /health/database:
    get:
      summary: Backend readiness status via ping
      security: []
      responses:
        '200': { description: Backend connected }
        '503': { description: Backend disconnected; body includes the ping error }
  /health/jobs:
    get:
      summary: Durable job repository readiness
      security: []
      responses:
        '200': { description: Job repository ready }
        '503': { description: Job repository unavailable }
  /health/promotions:
    get:
      summary: Promotion and signed-governance repository and authoritative-chain readiness
      security: []
      responses:
        '200':
          description: Promotion repository ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionHealth' }
        '503':
          description: Promotion repository or decision chain unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionHealth' }
  /metrics:
    get:
      summary: Prometheus-style request metrics
      security: []
      responses:
        '200': { description: Text exposition format }
  /openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        '200': { description: OpenAPI 3.0 YAML }
  /api/auth/session:
    get:
      summary: Inspect the verified caller, granted scopes and server edition
      description: >-
        Available to every valid identity without requiring a data or tenant-admin scope.
        Uses the normal bearer validation and active-tenant admission rules. Returns
        Cache-Control no-store. When authentication is disabled, user is null and scopes
        is empty; this does not create an Admin identity or enable otherwise gated workflows.
      responses:
        '200':
          description: Verified session context or explicit authentication-disabled mode
          content:
            application/json:
              schema:
                type: object
                required: [auth_enabled, user, scopes, edition]
                properties:
                  auth_enabled: { type: boolean }
                  edition: { type: string, enum: [community, enterprise] }
                  user:
                    type: object
                    nullable: true
                    required: [key, username, role, tenant]
                    properties:
                      key: { type: string }
                      username: { type: string }
                      role: { type: string }
                      tenant: { type: string }
                  scopes:
                    type: array
                    items: { type: string }
        '401': { description: 'Missing, invalid, expired, revoked or stale bearer identity' }
        '403': { description: Tenant inactive or isolated storage unavailable }
  /api/auth/login:
    post:
      summary: Exchange username/password for a JWT session (requires COGNIGRAPH_JWT_SECRET)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: JWT bearer token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_in: { type: integer }
        '401': { description: Bad credentials }
  /api/documents:
    post:
      summary: Create a document in an ordinary collection; M25 semantic-control and construction-derived collections require dedicated typed paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection: { type: string }
              additionalProperties: true
      responses:
        '200': { description: 'Created: {_id, _key, collection}' }
        '403': { description: "Generic mutation targets a protected M25 collection (space_types, neurons, review_policies, eval_specs, entities, chunks, mentions, or facts) or a system collection" }
        '409': { description: Key conflict }
    get:
      summary: List documents, including compatible reads of protected ordinary M25 collections
      parameters:
        - { name: collection, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer } }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { description: Documents, content: { application/json: { schema: { $ref: '#/components/schemas/Results' } } } }
  /api/documents/embed:
    post:
      summary: >-
        Batch embedding pipeline: embeds each item's text server-side
        (provider batches, bounded concurrency) and stores everything in
        one atomic backend batch. All-or-nothing; requires
        COGNIGRAPH_EMBEDDING_PROVIDER. Items arrive pre-chunked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, items]
              properties:
                collection: { type: string }
                items:
                  type: array
                  items: { type: object }
                text_field: { type: string, default: text }
                embedding_field: { type: string, default: embedding }
                batch_size: { type: integer, default: 64 }
                upsert: { type: boolean, default: false, description: 'Existing _key merges (re-embed) instead of 409; new keys still insert' }
      responses:
        '200': { description: '{stored, keys, model, batches}' }
        '400': { description: An item lacks text at text_field }
        '403': { description: Embedding targets a protected M25 semantic-control or construction-derived collection; rejection occurs before provider calls or writes }
        '409': { description: Key conflict (upsert false) — nothing stored }
  /api/documents/{collection}/{key}:
    get:
      summary: Fetch one document
      parameters: &docPath
        - { name: collection, in: path, required: true, schema: { type: string } }
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Document }
        '404': { description: Not found }
    patch:
      summary: Partial update (merge) in an ordinary collection; protected M25 collections are read-only through this generic route
      parameters: *docPath
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
      responses:
        '200': { description: Updated document }
        '403': { description: Generic mutation targets a protected M25 or system collection }
    put:
      summary: Replace in an ordinary collection; protected M25 collections are read-only through this generic route
      parameters: *docPath
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Document' } } } }
      responses:
        '200': { description: Replaced document }
        '403': { description: Generic mutation targets a protected M25 or system collection }
    delete:
      summary: Delete from an ordinary collection; protected M25 collections are read-only through this generic route
      description: >-
        Removes generated side-views for this exact document handle through the
        shared deletion boundary. Native commits the parent and side-view deletes
        atomically. Cleanup failures propagate; retry can finish cleanup of an
        already-absent parent. Deletion invalidates in-flight side-view generation.
      parameters: *docPath
      responses:
        '200': { description: '{deleted: bool, _id: string, side_views_deleted: integer}' }
        '403': { description: Generic mutation targets a protected M25 or system collection }
  /api/graph/relationships:
    post:
      summary: Upsert an edge (by _from, _to, relation_type) in an ordinary edge collection; M25 derived collections are protected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, relation_type]
              properties:
                from: { type: string, example: docs/a }
                to: { type: string }
                relation_type: { type: string }
                collection: { type: string, default: document_relations }
              additionalProperties: true
      responses:
        '200': { description: The edge }
        '403': { description: Generic graph mutation targets a protected M25 or system collection }
    get:
      summary: Edges of a vertex
      parameters:
        - { name: vertex_id, in: query, required: true, schema: { type: string } }
        - { name: collection, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [outbound, inbound, any] } }
      responses:
        '200': { description: Edges }
  /api/graph/traverse:
    post:
      summary: Multi-hop traversal from a start vertex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [start_vertex]
              properties:
                start_vertex: { type: string }
                edge_collection: { type: string }
                max_depth: { type: integer, default: 2 }
                min_depth: { type: integer, default: 1 }
                direction: { type: string, enum: [outbound, inbound, any] }
                min_confidence: { type: number, nullable: true }
      responses:
        '200': { description: 'Traversal paths (vertices, edges, depth, score)' }
  /api/search/vector:
    post:
      summary: Vector similarity search (raw vector)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vector]
              properties:
                collection: { type: string, default: embeddings }
                vector: { type: array, items: { type: number } }
                threshold: { type: number }
                limit: { type: integer, default: 10 }
                model_name: { type: string, nullable: true }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { $ref: '#/components/schemas/Results' } } } }
  /api/search/text:
    post:
      summary: Plain BM25 full-text search over string fields (no embedder required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection, query]
              properties:
                collection: { type: string }
                query: { type: string }
                fields: { type: array, items: { type: string }, default: [content, title] }
                limit: { type: integer, default: 10 }
      responses:
        '200': { description: Hits, content: { application/json: { schema: { $ref: '#/components/schemas/Results' } } } }
  /api/search/query:
    post:
      summary: Parsed read-only CGQL; supports EXPLAIN and EXPLAIN ANALYZE
      description: Compatible reads may inspect protected ordinary M25 collections through the parsed, budgeted CGQL path. Underscore authority collections remain hidden, and opaque backend-native query text is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: 'FOR d IN docs FILTER d.score >= 2 LIMIT 10 RETURN d.title' }
                bind_vars: { type: object, additionalProperties: true }
                language: { type: string, nullable: true, enum: [cgql], description: 'Optional; omitted and cgql both select the parsed read-only path. Public opaque backend-native query text is disabled.' }
      responses:
        '200': { description: Rows, content: { application/json: { schema: { $ref: '#/components/schemas/Results' } } } }
        '400': { description: Invalid request }
        '403': { description: "Forbidden data access including DOCUMENT lookups, or an opaque backend-native query language was requested" }
        '500': { description: CGQL processing or backend execution failure including storage and budget errors; failed DOCUMENT lookups never become null results }
        '503': { description: Backend connection failure }
  /api/search/semantic:
    post:
      summary: Semantic search (embeds the query; requires COGNIGRAPH_EMBEDDING_PROVIDER)
      description: Cache reuse requires identical result parameters. An omitted or null model_name accepts any model; an empty string matches only that literal stored model name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                collection: { type: string }
                threshold: { type: number }
                limit: { type: integer }
                model_name: { type: string, nullable: true, description: 'Optional exact stored model-name filter; empty string is distinct from omitted/null.' }
      responses:
        '200': { description: Hits; may be cache-direct or cache-assisted }
  /api/search/hybrid:
    post:
      summary: Hybrid BM25 + vector search with RRF fusion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                documents_collection: { type: string, default: documents, description: Native text-search collection }
                embeddings_collection: { type: string, default: embeddings }
                search_fields: { type: array, minItems: 1, items: { type: string }, default: [content, title] }
                threshold: { type: number, default: 0.7 }
                limit: { type: integer, default: 10 }
                rrf_k: { type: number, default: 60 }
                bm25_weight: { type: number, default: 0.5 }
                vector_weight: { type: number, default: 0.5 }
      responses:
        '200': { description: Fused hits }
  /api/search/graph-augmented:
    post:
      summary: Semantic seeds + multi-hop expansion + ranked graph facts
      description: |
        `graph_facts` in the response is the traversed edge set ranked for a
        retrieval trace; accepted relation_rank_hint neurons in
        `neurons_collection` reweight it (proposed/rejected are inert).
        Strong cached responses keep `graph_facts` from cache-entry metadata.
        An above-floor weak match is only a weighted ranking signal: the route
        reruns fresh vector retrieval and live graph traversal and ignores the
        cached trace metadata. At or below the cache floor, retrieval is fresh.
        All cache paths require identical result parameters, including the
        complete edge and neuron collection names and optional confidence.
        Neuron-built facts live in the managed `facts` edge collection; the
        default `edge_collection` is the application-written
        `document_relations`. Enterprise responses computed in the request
        (fresh or cache-assisted) carry `warnings` with code
        `inert_rank_hints` when accepted relation_rank_hint neurons exist but
        `edge_collection` is not exactly `facts`; strong cache hits omit
        `warnings` because they perform no neurons read.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
                collection: { type: string, default: embeddings }
                edge_collection: { type: string, default: document_relations, description: 'Pass "facts" to rank construct-built facts and let accepted rank hints apply' }
                threshold: { type: number, default: 0.7 }
                seed_limit: { type: integer, default: 5 }
                max_depth: { type: integer, default: 2 }
                direction: { type: string, enum: [outbound, inbound, any], default: outbound }
                min_confidence: { type: number, nullable: true }
                path_decay: { type: number, default: 0.8 }
                limit: { type: integer }
                neurons_collection: { type: string, default: neurons }
                graph_facts_limit: { type: integer, default: 12 }
      responses:
        '200': { description: 'results + graph_facts [{source, relation, target, evidence_chunk_id, fact}]; Enterprise adds warnings [{code: inert_rank_hints, message, accepted_rank_hints, edge_collection}] when present' }
  /api/query:
    post:
      summary: Parsed read-write CGQL for ordinary collections (mutations; mounted only when COGNIGRAPH_CGQL_MUTATIONS_ENABLED=true)
      description: Public opaque backend-native query text is never accepted. The complete parsed mutation plan is preflighted before execution and rejects any protected M25 semantic-control or construction-derived collection. Mutation queries containing DOCUMENT() or correlated traversal starts are rejected before any write, including calls in nested read subqueries and RETURN expressions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, example: 'INSERT {name: @n} INTO people RETURN NEW' }
                bind_vars: { type: object, additionalProperties: true }
                invalidate: { type: array, items: { type: string }, deprecated: true, description: Legacy hint accepted for compatibility; M15 invalidates all result entries dependency-safely }
      responses:
        '200': { description: Rows (NEW/OLD for mutations) }
        '400': { description: "CGQL syntax or semantic validation failure, including unsupported dynamic backend reads in mutation queries" }
        '403': { description: "Forbidden data access including DOCUMENT lookups, protected M25 mutations, or missing required scope" }
        '500': { description: CGQL execution or backend failure including storage and budget errors; failed DOCUMENT lookups never become null results }
        '503': { description: Backend connection failure }
  /api/batch:
    post:
      summary: Capability-dependent atomic batch of document operations
      description: Native executes the batch in one all-or-nothing transaction; backends without atomic-batch capability reject it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ops]
              properties:
                ops:
                  type: array
                  items:
                    type: object
                    description: 'insert {collection, doc} | update {collection, key, merge} | replace {collection, key, doc} | delete {collection, key}'
                invalidate:
                  type: array
                  items: { type: string }
                  deprecated: true
                  description: Legacy hint accepted for compatibility; M15 invalidates all result entries dependency-safely
      responses:
        '200': { description: Per-op results; all-or-nothing }
        '403': { description: Batch preflight found any mutation targeting a protected M25 or system collection; no operation executes }
        '500': { description: "Active backend does not provide atomic batches, or the transaction failed" }
  /api/lua/execute:
    post:
      summary: Run a sandboxed Lua script; typed mutations require documents:write and graph.query accepts only parsed CGQL, never raw backend text
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [script]
              properties:
                script: { type: string }
      responses:
        '200': { description: Script result }
        '403': { description: 'Caller lacks lua:execute, a typed mutation lacks documents:write, data access is forbidden including DOCUMENT lookups, or graph.query would invoke opaque backend-native text' }
        '500': { description: Uncaught script or backend execution failure; a script may handle errors with pcall }
        '503': { description: Uncaught typed backend connection failure from a graph binding }
  /api/collections:
    get:
      summary: Collection catalog — names, types ("document"/"edge"), and counts (DocumentsRead scope)
      responses:
        '200': { description: '{collections[{name, collection_type, count}], count}' }
    post:
      summary: Create an ordinary collection explicitly (idempotent ensure; DocumentsWrite scope; system and M25 managed names reserved)
      responses:
        '200': { description: '{name, collection_type}' }
        '403': { description: "Name is a protected M25 semantic-control, construction-derived, or system collection" }
  /api/collections/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    delete:
      summary: Drop an ordinary collection and all of its documents (DocumentsWrite scope; system and M25 managed collections refused)
      description: >-
        Cleans up the collection's generated side-views and invalidates in-flight
        generation before dropping the source collection. Cleanup errors prevent
        the drop. A later drop failure may leave the source without side-views;
        retry the drop or regenerate those retrieval aids.
      responses:
        '200': { description: '{dropped}' }
        '403': { description: "Name is a protected M25 semantic-control, construction-derived, or system collection" }
  /api/cache/stats:
    get:
      summary: Query-cache statistics (admin)
      responses:
        '200': { description: Hit/miss breakdown }
  /api/cache/clear:
    post:
      summary: Clear the query cache (admin)
      responses:
        '200': { description: Cleared }
  /api/tenants:
    get:
      summary: List tenant records (TenantAdmin scope — host-admin lifecycle only, no data access)
      responses:
        '200': { description: '{tenants[], count}' }
    post:
      summary: Create a tenant record (name = 1-63 chars of [a-z0-9-]); max_active_jobs is enforced by the durable queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                quotas: { type: object, description: extensible quota object; max_active_jobs is capped by the host per-tenant limit }
      responses:
        '200': { description: Tenant record }
        '409': { description: Tenant exists }
  /api/tenants/{name}:
    post:
      summary: Update tenant status (active|suspended) — a suspended tenant's users are refused at the middleware
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        '200': { description: Updated tenant record }
    delete:
      summary: Delete the tenant RECORD (M1; the data store, once M2 lands, is removed separately and deliberately)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: '{deleted: bool}' }
  /api/tenants/{name}/quotas:
    post:
      summary: Merge tenant quota keys (TenantAdmin); null removes a key and max_active_jobs is enforced immediately for new admissions
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_active_jobs: { type: integer, minimum: 0, description: queued + running + cancel_requested; lowering below current usage never discards work }
              additionalProperties: true
      responses:
        '200': { description: Updated tenant record with merged quotas }
        '400': { description: Invalid quota or value above the configured host cap }
        '404': { description: Tenant not found }
  /api/tenants/{name}/admin:
    post:
      summary: Provision the first tenant-local Admin (HostAdmin only; rejected once an Admin exists)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password, writeOnly: true }
      responses:
        '200': { description: First tenant-local Admin user }
        '403': { description: "Tenant is unknown or suspended, or caller is not HostAdmin" }
        '409': { description: Tenant already has an Admin or username exists }
  /api/users:
    post:
      summary: Create a user (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, role]
              properties:
                username: { type: string }
                password: { type: string }
                role: { type: string, enum: [admin, editor, viewer, script-runner, policy-author, policy-approver, promoter, artifact-attestor] }
                tenant: { type: string, description: Must match the caller's tenant; tenant-local admins cannot create host-admin identities. }
      responses:
        '200': { description: Created user }
    get:
      summary: List users (admin)
      responses:
        '200': { description: Users }
  /api/users/{key}:
    delete:
      summary: Delete a user (admin)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }
  /api/users/{key}/tokens:
    post:
      summary: >-
        Issue an API token for a user (admin); the secret is returned once.
        Optional expires_in_secs overrides COGNIGRAPH_TOKEN_TTL_SECS
        (0 = non-expiring).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Token (store it — only the hash is kept) }
    get:
      summary: List a user's tokens (admin)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Token metadata }
  /api/users/{key}/tokens/{token_key}:
    delete:
      summary: Revoke a token (admin)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: token_key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Revoked }
  /api/users/{key}/tokens/{token_key}/rotate:
    post:
      summary: >-
        Rotate a token in place (admin): same record and key, fresh secret
        and expiry window; the old secret stops validating immediately.
        Optional expires_in_secs as on token creation.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
        - { name: token_key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: New token (store it — only the hash is kept) }
  /api/construct/directed:
    post:
      summary: Synchronous taxonomy-directed construction with deterministic evidence gates
      description: >-
        Requires graph-write authority, a completion provider, and Native atomic
        batches. Accepts 1..32 chunks in one completion call; normal HTTP body
        limit is 2 MiB and the configured request timeout applies. There is no
        directed durable job kind or idempotency header. Taxonomy relations must
        be nonblank and unique after trimming, with nonblank restraint vocabulary.
        Chunk text is NFC before prompting, hashes, and byte spans. Quote matching
        tolerates ASCII case and whitespace runs after NFC, while endpoints and
        affirmative restraint must survive the evidence gates. Malformed model
        envelopes fail without occurrence replacement; a valid empty facts array
        (or all proposals rejected) DOES replace the supplied chunks' earlier
        occurrences with zero. Reconciliation covers every supplied chunk and
        preserves other chunks; it is not append-only or taxonomy-filtered.
        Replays are idempotent only for a fixed extraction result; model results
        can differ. A missing space is created as accepted and rule-less before
        completion, and can remain after a later failure. Active governed
        deployments reject this legacy writer before provider calls; a promotion
        transition fence covers admission through completion and publication.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectedConstructRequest' }
      responses:
        '401': { description: Authentication is required when enabled }
        '200': { description: '{space_type, chunks, proposed, facts_grounded, skips, extracted_by}' }
        '400': { description: "Empty/oversized chunks, invalid taxonomy, or occurrence identity validation failure" }
        '403': { description: "Caller lacks graph-write scope, or a governed deployment fences this legacy writer" }
        '408': { description: Configured HTTP request deadline exceeded; synchronous backend effects may already have completed }
        '413': { description: Request body exceeds the normal 2 MiB limit }
        '422': { description: "JSON does not match the request shape, including unknown top-level fields" }
        '500': { description: "Missing completion provider, failed/malformed completion, unsupported atomic batches, or backend reconciliation failure" }
  /api/construct/ingest:
    post:
      description: Chunk text is normalized to NFC before rule grounding and hashing. Evidence spans and fact occurrence keys are derived from the canonical stored text. Re-ingestion explicitly replaces earlier hashes and occurrences.
      summary: >-
        Legacy lifecycle ingestion: ground chunks into evidence-bound fact edges using a stored space
        type, with the space's ACCEPTED neurons applied (hints extend
        triggers, blockers veto). Native ingestion atomically replaces each
        supplied chunk's text, mentions, and independent fact occurrences;
        maintenance backends without atomic batches reject before writes.
        Negation-aware; no model involved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type, chunks]
              properties:
                space_type: { type: string, description: "Existing id in the protected space_types collection; use the dedicated draft/accept workflow for legacy authoring, not generic document mutation." }
                chunks:
                  type: array
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id: { type: string }
                      title: { type: string }
                      text: { type: string }
      responses:
        '200': { description: '{space_type, chunks, facts_grounded, accepted_neurons}' }
        '400': { description: "Unknown space type, empty chunks, sanitized-key collision, or legacy chunk requiring a derived-collection rebuild" }
        '500': { description: "Active backend lacks atomic batches, or atomic reconciliation failed" }
  /api/construct/governed-ingest:
    post:
      summary: Atomically materialize chunks from the exact currently selected and approved M25 Semantic Repair revision
      description: >-
        Resolves the target's existing M18-M24 promotion head to exactly one
        immutable PolicyAuthor revision and independent approving review,
        projects its unchanged M22 typed candidate into the runtime
        construction configuration, and keeps the process-local promotion
        transition lock through the graph transaction. Selection cannot race
        this invocation. This is bounded invoked materialization; it is not an
        automatic corpus reconciliation or atomic graph-generation switch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GovernedConstructIngestRequest' }
      responses:
        '200':
          description: Atomic ingestion counts and the exact promotion, revision, and review authority used
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GovernedConstructIngestResponse' }
        '400': { description: "Invalid target, empty chunk set, invalid chunk or candidate semantics, or derived-key collision" }
        '401': { description: Authentication is required when enabled }
        '403': { description: "Caller lacks graph-write scope or the author, reviewer, and promoter principals are not independent" }
        '409': { description: "No current head, no exactly matching approved revision, stale selection, divergent immutable authority, or a signed record was admitted after its applicable key revocation" }
        '413': { description: Request exceeds the server JSON transport-body limit }
        '422': { description: Malformed JSON or request body does not match the governed-ingest wire shape }
        '429': { description: Chunk-count or deterministic grounding-work capacity is exceeded; Retry-After is returned }
        '500': { description: "Active backend lacks atomic batches, or atomic reconciliation failed" }
        '503': { description: "Promotion, signed governance, or Semantic Repair repository is unavailable" }
  /api/construct/propose:
    post:
      summary: >-
        Gap-directed repair: for each missing fact, retrieve evidence via
        the backend's BM25, have the completion model draft VERBATIM
        trigger phrases (symbolically self-checked — paraphrases are
        refused and reported as skips), and store the proposals as
        status=proposed neurons with authorship. Inert until a human
        accepts via POST /api/neurons/{key}/accept; even then this legacy
        lifecycle state affects only legacy ingestion and does not satisfy
        M25 signed-revision, independent-review, or promotion-head authority. Gaps may be passed
        explicitly or measured live from the (inline or stored) eval
        spec. Requires a completion provider (OPENAI_API_KEY or
        GEMINI_API_KEY; model via COGNIGRAPH_COMPLETION_MODEL).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type]
              properties:
                space_type: { type: string }
                gaps:
                  type: array
                  items: { type: string, example: "Nimbus --SUPPLIES--> DataCloud" }
                eval:
                  type: object
                  description: Inline EvalSpec for gap measurement; omission reads an already-existing protected eval_specs/{space_type} record. Generic writes to eval_specs are refused after M25.
      responses:
        '200': { description: '{gaps, stored, proposed[], skipped[], proposed_by}' }
        '400': { description: "Bad gap line, or no gaps source available" }
  /api/construct/review:
    post:
      summary: >-
        Apply the space's already-existing legacy review policy (review_policies/{space}):
        judge every proposed neuron (schema-constrained LLM reviewer,
        attribution judge:<model>@<policy-rev>) and auto-accept Lane A
        (relation_hint only, judge accept at/above min_confidence,
        non-precision-critical existing rules, same acceptance validation
        as a human accept, deterministic audit sampling). Everything else
        (including aliases, blockers, and rank hints) stays proposed WITH the verdict attached as triage — the judge
        never auto-rejects. Requires injection_suite_passed: true (D5
        gate) and auto_accept.qualified_judges naming the judge models
        the attestation covers — an unlisted active judge model runs as
        triage only (lane_a: withheld, everything queues). Optional
        auto_accept.agreement (Lane A+, decision_agreement_lane.md)
        extends auto-accept to hints on templated/gated existing rules
        via two-judge concordance: exactly two attested judge models
        (COGNIGRAPH_JUDGE_PARTNER_MODEL runs the partner), both must
        accept at/above agreement.min_confidence, disagreements queue
        with both verdicts, pair mismatch degrades to queue
        (lane_a_plus: withheld). Requires concordance_measured: true
        (zero concordant false-accepts in examples/concordance_sim.rs).
        No policy document = review stays fully human. Its result is legacy
        neuron lifecycle state, not M25 signed Semantic Repair authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type]
              properties:
                space_type: { type: string }
                limit: { type: integer, description: judge at most N UNJUDGED proposals (oldest key first) — cron-able resumable drain }
                rejudge: { type: boolean, default: false, description: re-judge already-judged proposals (after a POLICY_REV change) }
      responses:
        '200': { description: '{judge, reviewed, pending_remaining, judge_calls, elapsed_ms, lane_a, lane_a_plus, auto_accepted[{key, lane, confidence}], queued[{key, verdict, confidence, lane_b_reason}]}' }
        '400': { description: "No/invalid policy, missing attestation, or non-whitelisted kinds" }
  /api/construct/evaluate:
    post:
      summary: >-
        Measure construction against an eval spec: recall (expected facts
        built) and restraint (forbidden facts NOT built), with the missing
        and violating facts listed. Deterministic, no model; POST for the
        body but read-only in effect (read scope). The spec may be inline
        or read from an already-existing protected eval_specs collection row
        keyed by the space id; M25 refuses generic eval_specs mutation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type]
              properties:
                space_type: { type: string }
                eval:
                  type: object
                  description: Inline EvalSpec; omission reads an existing protected eval_specs/{space_type} row.
      responses:
        '200': { description: '{recall: {found, total}, restraint: {violations, total}, recall_ok, restraint_ok, missing[], violations[]}' }
        '400': { description: No inline eval and no stored spec }
  /api/construct/draft:
    post:
      summary: Draft a new inert ontology, synchronously or as a durable job
      description: >-
        Needs graph-write scope and the main completion provider. Refuses an
        existing space_types id. The draft remains in space_type_drafts until
        explicit acceptance; it does not ingest the chunks. Sync mode returns a
        draft, with optional per_document grouping. Async mode always groups by
        trimmed title, accepts at most 2000 groups, and freezes the same input as
        construct.draft through /api/jobs. async and per_document are wrapper
        controls, not fields in generic job input. Both modes accept a body up to
        16 MiB + 64 KiB; queued input itself is capped at 16 MiB. The configured
        HTTP deadline applies to synchronous drafting; prefer async for corpora.
        Async submission returns Location and 202, or 200 for canonical input
        replay. The accumulating draft is drafting and cannot be accepted until
        the job publishes status draft. Each document uses two completion calls.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Required only when async is true; 1-128 printable ASCII characters. Same tenant-incarnation namespace as all job submissions.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConstructDraftRequest' }
      responses:
        '401': { description: Authentication is required when enabled }
        '200':
          description: 'Synchronous {space_type, status: draft, drafted_by, entities, relation_rules, per_document, documents, skips, advisor, note}, or async replay {job, replayed: true}; Location only for async.'
        '202':
          description: New durable construct.draft job
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSubmission' }
        '400': { description: "Existing space, empty corpus, too many async document groups, missing async key/provider, or invalid queued input" }
        '403': { description: Caller lacks graph-write scope }
        '408': { description: Configured request deadline exceeded }
        '409': { description: Async idempotency key already names different input }
        '413': { description: HTTP body exceeds 16 MiB + 64 KiB }
        '422': { description: JSON field types do not match the request }
        '429': { description: Async job capacity is full; Retry-After is returned }
        '500': { description: "Missing synchronous completion provider, completion failure, or storage error" }
  /api/construct/draft/{id}/accept:
    post:
      summary: >-
        Accept a draft space type — the explicit, attributed human act
        that turns a draft into vocabulary. Uses the CURRENT stored
        draft (edit it via the documents API first; that is the review
        path), re-validates it parses, copies it to space_types with
        drafted_by/accepted_by/accepted_at, and marks the draft
        accepted. Refuses if the space already exists or the draft is
        not in draft status. Write scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: '{status: accepted, accepted_by, entities, relation_rules}' }
        '400': { description: "No such draft, not in draft status, no longer parses, or space exists" }
  /api/construct/answer-eval:
    post:
      summary: >-
        Answer-level measurement: whether constructed facts carry through
        the graph-augmented trace into a model's ANSWERS — per-question
        recall and restraint with fabrications listed. Needs the
        completion provider (asks a model; non-deterministic; restraint
        is behavioral, never structural). two_pass adds a
        completeness-critic second pass per question (additions only,
        trace-checked; restraint measured over the union). Read scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type]
              properties:
                space_type: { type: string }
                eval:
                  type: object
                  description: Inline EvalSpec; omission reads an existing protected eval_specs/{space_type} row.
                two_pass: { type: boolean, default: false }
                evidence_sentences: { type: boolean, default: false, description: augment trace fact lines with their licensing sentences — measured best for meta/process questions; keep off for entity-dense adversarial corpora }
      responses:
        '200': { description: '{two_pass, recall_ok, restraint_ok, questions[]: {id, question, recall: {found, total}, restraint: {asserted, total}, asserted[], fabricated[]}}' }
        '400': { description: "No completion provider, or no inline eval and no stored spec" }
  /api/construct/advise:
    post:
      summary: >-
        The gate advisor: per relation rule, where a require_in_sentence
        gate is SAFE to apply (blocks off-subject groundings while the
        fact keeps grounding) and which endpoints appear in NO licensing
        sentence (the cross-company leakage signature — flagged for
        author review with sample sentences, never auto-suggested).
        Deterministic, no model, read-only in effect (read scope). Uses
        the exact production gate semantics via ground_chunk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type]
              properties:
                space_type: { type: string }
                chunks:
                  type: array
                  description: inline corpus; omit to analyze the space's stored chunks
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id: { type: string }
                      title: { type: string }
                      text: { type: string }
      responses:
        '200': { description: '{chunks, suggestions, review_flags, rules[]: {fact, current_gate[], grounds_ungated, source_gate/target_gate/both_gate: {grounds, blocked}, suggestion?, never_in_sentence[], reason, samples[]}}' }
        '400': { description: No inline chunks and none stored for the space }
  /api/sideviews/generate:
    post:
      summary: Enqueue durable context-expansion side-view generation for a source collection
      description: >-
        Queues one tenant-scoped background job that, per document in the source
        collection, generates retrieval "side-views" (self-contained question/
        answer pairs) with the configured side-view model, embeds each question,
        and stores the results in the quarantined side_views collection through
        the trusted internal handle. Side-views are a non-authoritative retrieval
        aid, never governed facts, and are written to no managed collection. The
        source collection must be an ordinary collection — system, governed, and
        machine-generated collections are rejected. Requires both a side-view
        completion provider and an embedding provider to be configured, plus an
        atomic-batch-capable backend. Source collection names and document keys
        retain exact Unicode identity; source collection names cannot contain `/`. The heavy
        model work runs in the background; this
        call freezes the source key set and returns the job envelope. Source text
        is read when each document runs. Deletion or collection drop during a
        provider call invalidates publication, even if the same key is recreated.
        The job fails with a source-conflict diagnostic; retry reads the current
        source or skips it if absent. Idempotency is mandatory: the same key and
        input replay the existing job. Ordinary updates still require explicit
        regeneration to refresh existing side-views.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 1-128 printable ASCII characters, unique within the tenant incarnation across all job kinds.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SideviewsGenerateJobInput' }
      responses:
        '413': { description: HTTP body exceeds 16 MiB + 64 KiB; queued input is independently capped at 16 MiB }
        '202':
          description: New side-view generation job accepted
          headers:
            Location:
              description: Tenant-scoped job detail URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSubmission' }
        '200':
          description: Idempotent replay of the existing job
          headers:
            Location:
              description: Tenant-scoped job detail URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSubmission' }
        '400': { description: "Missing idempotency key, ineligible source collection or ambiguous collection name, unconfigured provider, missing atomic batch support, or too many source documents" }
        '401': { description: Authentication is required when enabled }
        '403': { description: Caller lacks graph-write scope }
        '409': { description: Idempotency key was already used for different input }
        '429': { description: Tenant or process-wide durable-job capacity is full; Retry-After is returned }
  /api/jobs:
    post:
      summary: Submit a durable governed operation
      description: >-
        Captures a tenant-scoped immutable input snapshot and queues it for
        execution. Idempotency is mandatory: the same key and same input
        replay the existing job, while reuse with different input is rejected.
        Creating a job is a write operation even when its eventual work is an
        evaluation. Restart recovery requires persistent storage; construction
        ingest and side-view generation require the backend's atomic-batch
        capability. Four kinds are supported: construct.ingest, construct.evaluate,
        construct.draft, and sideviews.generate. Each has a strict input shape;
        draft always groups per document and side-views freeze keys, not text or
        provider/model configuration. Canonical input is limited to 16 MiB;
        the HTTP envelope limit is 16 MiB + 64 KiB. Semantic input failures return
        400; JSON/envelope deserialization failures return 422.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 1-128 printable ASCII characters, unique within the tenant incarnation across all job kinds.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobSubmissionRequest' }
      responses:
        '401': { description: Authentication is required when enabled }
        '403': { description: Caller lacks graph-write scope }
        '413': { description: HTTP body exceeds 16 MiB + 64 KiB }
        '422': { description: Invalid JSON envelope or unsupported kind }
        '202':
          description: New job accepted
          headers:
            Location:
              description: Tenant-scoped job detail URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSubmission' }
        '200':
          description: Idempotent replay of the existing job
          headers:
            Location:
              description: Tenant-scoped job detail URL
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobSubmission' }
        '400': { description: 'Invalid or missing idempotency key or operation input' }
        '409': { description: Idempotency key was already used for different input }
        '429': { description: Tenant or process-wide durable-job capacity is full; Retry-After is returned }
        '503': { description: "M21-M23 verified artifact consumption, preparation, or derivation is unavailable because the local CAS or startup-pinned executable identity is not configured" }
    get:
      summary: List jobs in the authenticated tenant
      description: >-
        Cursor mode is the default and reads a repairable lightweight catalog in
        stable newest-first key order with a fixed scan budget. Exact total is
        deliberately null. Supplying offset selects the deprecated exact-total
        compatibility path, capped at 10,000 and limited to non-archived jobs.
        Cursors bind the tenant incarnation and all filters; status pagination is
        a live view rather than a point-in-time snapshot.
      parameters:
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/JobKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string }, description: Opaque cursor returned by the previous page; mutually exclusive with offset. }
        - { name: archived, in: query, schema: { type: string, enum: [exclude, include, only], default: exclude } }
        - { name: offset, in: query, deprecated: true, schema: { type: integer, minimum: 0, maximum: 10000 }, description: Supplying this parameter opts into the deprecated exact-total path. }
      responses:
        '200':
          description: Tenant-scoped jobs, newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobList' }
  /api/jobs/{id}:
    get:
      summary: Fetch a job and its append-only audit events
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '404': { description: Job not found in the authenticated tenant }
  /api/jobs/{id}/cancel:
    post:
      summary: Request cancellation of a queued or running job
      description: >-
        Only the submitting actor or an Admin may cancel. Queued jobs cancel
        immediately. Running ingest stops at the next durable batch boundary;
        evaluation stops before its terminal result checkpoint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Updated job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobCancellation' }
        '403': { description: Caller is neither the submitter nor an Admin }
        '404': { description: Job not found in the authenticated tenant }
        '409': { description: Archived jobs are immutable }
  /api/jobs/{id}/retry:
    post:
      summary: Retry a failed or canceled job
      description: >-
        Only the submitting actor or an Admin may retry. Resume continues from
        the last checkpoint; restart begins again from the immutable input.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: Idempotency-Key
          in: header
          required: true
          description: 1-128 printable ASCII characters; deduplicates the canonical mode and reason request.
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [resume, restart], default: resume }
                reason: { type: string, maxLength: 1024 }
      responses:
        '200':
          description: Job requeued, or the same retry request replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobRetry' }
        '400': { description: Invalid or missing idempotency key }
        '403': { description: Caller is neither the submitter nor an Admin }
        '404': { description: Job not found in the authenticated tenant }
        '409': { description: 'Job is not failed or canceled, retry audit limit reached, archived, or the retry key was used with a different mode/reason' }
        '429': { description: Tenant or process-wide durable-job capacity is full; a replay of the same retry key is still allowed }
  /api/governance/status:
    get:
      summary: Inspect tenant signed-governance trust-anchor readiness
