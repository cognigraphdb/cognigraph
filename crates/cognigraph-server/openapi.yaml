  /api/neurons:
    post:
      summary: Author a neuron (validated against its space type; stored as proposed)
      description: |
        The space type must already exist in the protected `space_types`
        collection; the dedicated draft/accept flow is the legacy authoring
        path. Submitted status is ignored — acceptance is its own dedicated
        transition. Ontology violations are rejected at write time. This
        legacy lifecycle does not by itself satisfy M25 signed revision,
        independent review, and promotion-head authority.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [space_type, id, type, source, relation, target]
              properties:
                space_type: { type: string }
                id: { type: string, description: kebab-case }
                type: { type: string, enum: [alias, relation_hint, relation_rank_hint, relation_blocker] }
                source: { type: string }
                relation: { type: string }
                target: { type: string }
                triggers: { type: array, items: { type: string } }
                evidence: { type: array, items: { type: string } }
                confidence: { type: number }
                boost: { type: number, description: rank hints only }
      responses:
        '200': { description: '{_key, status: proposed, space_type}' }
        '400': { description: Ontology validation failure }
    get:
      summary: List neurons
      parameters:
        - { name: space_type, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [proposed, accepted, rejected, retired] } }
        - { name: limit, in: query, schema: { type: integer }, description: pagination for pilot-scale queues }
        - { name: offset, in: query, schema: { type: integer } }
      responses:
        '200': { description: Neuron documents (+ echoed limit/offset) }
  /api/neurons/graduation:
    get:
      summary: Leave-one-out graduation candidates for a space's accepted neurons
      description: |
        A relation_hint graduates when its fact still grounds without it
        (covered_by_base / covered_by_others); a relation_blocker when its
        forbidden fact no longer grounds even without the veto
        (inert_blocker). Flags only — retire via POST /api/neurons/{key}/retire.
      parameters:
        - { name: space_type, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: '{candidates: [{neuron_id, fact, reason, review}], count}' }
  /api/neurons/{key}/accept:
    post:
      summary: Accept a proposed neuron
      description: |
        Re-validates the neuron in accepted shape TOGETHER with the space's
        other accepted neurons — the accepted-hint/accepted-blocker
        same-triple conflict cannot be assembled one edit at a time.
        Stamps reviewed_by/reviewed_at (the authenticated user, or
        "anonymous" when auth is disabled).
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: "optional reviewer note, stored with the attribution" }
      responses:
        '200': { description: Accepted }
        '400': { description: Validation/conflict failure }
  /api/neurons/{key}/reject:
    post:
      summary: Reject a neuron (stamps reviewed_by/reviewed_at)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: "optional reviewer note, stored with the attribution" }
      responses:
        '200': { description: Rejected }
  /api/neurons/{key}/retire:
    post:
      summary: Retire an accepted neuron (stamps reviewed_by/reviewed_at)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: "optional reviewer note, stored with the attribution" }
      responses:
        '200': { description: Retired }
  /api/admin/jobs/status:
    get:
      summary: Tenant-local durable queue, admission, scheduler, retention, and catalog status (Admin)
      responses:
        '200': { description: '{tenant, tenant_incarnation, paused, shutting_down, queue, limits, catalog}' }
  /api/admin/jobs/reconcile:
    post:
      summary: Inspect or repair a bounded tenant-local job catalog/archive reconciliation slice (Admin)
      description: >-
        Authoritative live and archive records are scanned in bounded keyset
        pages. Missing/stale catalog rows and safe copy-first archive duplicates
        are repaired; malformed authoritative records fail closed. Follow
        next_cursor until null for a complete pass.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run: { type: boolean, default: false }
                limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
                cursor: { type: string, nullable: true }
      responses:
        '200': { description: '{dry_run, phase, scanned, catalog_created, catalog_updated, catalog_deleted, duplicates_resolved, next_cursor}' }
        '400': { description: Invalid limit or stale/cross-tenant cursor }
  /api/admin/jobs/archive:
    post:
      summary: Copy terminal jobs into the immutable tenant archive and remove them from the hot collection (Admin)
      description: >-
        Copy-first and resumable. No purge is performed: detail lookup,
        idempotency replay, and audit events remain available after archival.
        Omit before_ms to use COGNIGRAPH_JOB_RETENTION_SECS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                before_ms: { type: integer, format: int64, nullable: true }
                limit: { type: integer, minimum: 1, maximum: 1000 }
                cursor: { type: string, nullable: true }
                dry_run: { type: boolean, default: false }
                reason: { type: string, maxLength: 1024 }
      responses:
        '200': { description: '{dry_run, scanned, eligible, archived, next_cursor}' }
        '400': { description: "Invalid limit, reason, or stale cursor" }
  /api/admin/artifact-custody/evidence/{id}:
    get:
      summary: Derive a deterministic artifact recovery plan from immutable M21-M23 promotion evidence (Admin)
      description: >-
        Requires a live tenant-local Admin identity. Reads immutable evidence
        and historically valid signed attestations only. It performs no
        filesystem writes, CAS reads, signed-location dereferences, backup, or
        restore operation, and makes no current availability or custody claim.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/GovernanceRecordId' } }
      responses:
        '200':
          description: Closed deterministic recovery inventory
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ArtifactRecoveryPlanV1' }
        '400': { description: Evidence predates M21 or the requested plan is otherwise unsupported }
        '401': { description: "Authentication is disabled, absent, or stale" }
        '403': { description: Caller is not a live Admin in the routed tenant }
        '404': { description: Evidence or a referenced attestation does not exist }
        '409': { description: "Immutable evidence, binding, attestation, or digest-length authority conflicts" }
        '429': { description: "Manifest-entry, distinct-blob, or configured byte limit is exceeded" }
  /api/admin/promotions/status:
    get:
      summary: Tenant-local promotion repository and derived-head status (Admin)
      description: Authentication remains mandatory and fails closed when server-wide auth is disabled.
      responses:
        '200':
          description: Promotion repository, immutable-chain, and derived-head status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionOperatorStatus' }
        '401': { description: Authenticated Admin identity is required }
        '403': { description: "Authentication is disabled, no authenticated user was resolved, or the caller is not an Admin in this tenant" }
        '503': { description: Promotion repository is degraded or unavailable }
  /api/admin/promotions/reconcile:
    post:
      summary: Inspect or repair the derived promotion head for one target (Admin)
      description: >-
        Rebuilds the repairable head strictly from the immutable attributed
        decision chain. It never chooses a winner by timestamp and fails closed
        on forks, cycles, missing predecessors, or divergent generations.
        Authentication remains mandatory and fails closed when server-wide
        auth is disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: { $ref: '#/components/schemas/PromotionTarget' }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: Reconciliation report for the requested target
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionReconcileResult' }
        '400': { description: Invalid target }
        '401': { description: Authenticated Admin identity is required }
        '403': { description: "Authentication is disabled, no authenticated user was resolved, or the caller is not an Admin in this tenant" }
        '409': { description: Authoritative chain is divergent or malformed }
        '503': { description: Promotion repository is unavailable }
  /api/admin/promotions/recover:
    post:
      summary: Validate promotion authority, repair all derived heads, and clear the tenant health latch (Admin)
      description: >-
        Runs full tenant-incarnation recovery from immutable evidence and
        decisions. The health latch is cleared only after every authority
        record and decision chain validates and all repairable head projections
        are reconciled. Authentication remains mandatory and fails closed when
        server-wide auth is disabled.
      responses:
        '200':
          description: Promotion authority validated, projections repaired, and tenant mutations re-enabled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromotionRecoveryResult' }
        '401': { description: Authenticated Admin identity is required }
        '403': { description: "Authentication is disabled, no authenticated user was resolved, or the caller is not an Admin in this tenant" }
        '409': { description: Immutable promotion authority or a decision chain is divergent or malformed; the health latch remains set }
        '503': { description: Promotion repository is unavailable; the health latch remains set }
  /api/admin/export:
    get:
      summary: Full JSON snapshot of the database (hot backup, admin)
      responses:
        '200':
          description: '{collections: {name: {type, documents: {key: doc}}}}'
  /api/admin/import:
    post:
      summary: Restore a snapshot (admin); additive — overwrites matching keys
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: '{status: imported, collections: n}' }
  /api/admin/logs:
    get:
      summary: >-
        Recent non-2xx responses (admin) — method, path, status, latency,
        error message, tenant. Scoped to the caller's tenant plus
        untenanted events; a bounded in-memory ring, newest first.
      responses:
        '200':
          description: '{events: [{seq, at, method, path, status, latency_ms, message, tenant}], count}'
